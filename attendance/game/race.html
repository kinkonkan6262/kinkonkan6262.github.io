<script>
if(!window.THREE){document.getElementById('noweb').style.display='flex';}
else{try{
// ===== きんこんかん グランプリ =====
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ME={id:Math.random().toString(36).slice(2,10),name:'',car:'sports',color:0};
let soundOn=true,autoAcc=true,LV=1,HOST=true,ONLINE=false,HQ=true;
try{HQ=localStorage.getItem('kk_race_hq')!=='0';}catch(e){}
let composer=null,bloom=null,envMap=null;
const LAPS=3;
// ---- 車のしゅるい(オリジナル) ----
const CARS={
  sports:{name:'スポーツカー',max:62,acc:17,grip:1.0,turn:1.9,len:4.4,wid:1.9,mass:1.2,desc:'はやくて まがりやすい'},
  super:{name:'スーパーカー',max:70,acc:19,grip:.88,turn:1.75,len:4.5,wid:2.0,mass:1.3,desc:'いちばん はやい。すべりやすい'},
  sedan:{name:'セダン',max:56,acc:14,grip:1.05,turn:1.85,len:4.7,wid:1.85,mass:1.4,desc:'バランスが よい'},
  taxi:{name:'タクシー',max:55,acc:14.5,grip:1.08,turn:1.95,len:4.6,wid:1.8,mass:1.4,desc:'まがるのが じょうず'},
  kei:{name:'けいじどうしゃ',max:48,acc:15,grip:1.15,turn:2.2,len:3.4,wid:1.5,mass:.9,desc:'ちいさくて くるくる まがる'},
  truck:{name:'トラック',max:47,acc:10,grip:1.0,turn:1.5,len:7.0,wid:2.3,mass:3.0,desc:'おもくて つよい。ぶつかっても へいき'},
  bus:{name:'バス',max:45,acc:9,grip:1.0,turn:1.4,len:10.5,wid:2.5,mass:4.0,desc:'いちばん おおきい。ぶつけると つよい'}
};
const PALETTE=['#e53945','#2b6fe0','#22a355','#f2f2f2','#1d1d24','#ff8a1a','#9b5cff','#ffcf3a'];
// ---- 音 ----
let AC=null,eng=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f1,f2,d,type='sine',v=.08,delay=0){if(!soundOn)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}catch(e){}}
function engineStart(){if(eng||!soundOn)return;try{const a=ac(),o=a.createOscillator(),o2=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=700;g.gain.value=0;o.connect(f);o2.connect(f);f.connect(g);g.connect(a.destination);o.start();o2.start();eng={o,o2,g,f};}catch(e){}}
function engineSet(rpm,on){if(!eng)return;const t=ac().currentTime;eng.o.frequency.setTargetAtTime(40+rpm*110,t,.05);eng.o2.frequency.setTargetAtTime(20+rpm*55,t,.05);eng.g.gain.setTargetAtTime(on&&soundOn?.035:0,t,.1);}
function engineStop(){if(eng){try{eng.o.stop();eng.o2.stop();}catch(e){}eng=null;}}
function crash(){if(!soundOn)return;try{const a=ac(),n=a.sampleRate*.25,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=900;s.buffer=b;g.gain.value=.35;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}catch(e){}}
function speak(t){if(!soundOn)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
// ---- コース ----
const ROADW=15;
const CTRL=[[0,0],[0,160],[30,240],[110,270],[190,250],[240,190],[300,170],[370,200],[420,270],[500,280],[560,230],[570,140],[520,70],[440,40],[380,-20],[400,-110],[360,-180],[270,-200],[190,-160],[150,-80],[90,-60],[30,-90],[0,-60]];
let TR=null;
function buildTrack(){
  const pts=CTRL.map(([x,z])=>new THREE.Vector3(x,0,z));
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal');
  const N=1600,P=[],T=[],L=[];
  for(let i=0;i<N;i++){const u=i/N,p=curve.getPointAt(u),t=curve.getTangentAt(u).normalize();P.push(p);T.push(t);L.push(new THREE.Vector3(-t.z,0,t.x));}
  // 曲がり具合
  const K=[];for(let i=0;i<N;i++){const a=T[i],b=T[(i+8)%N];K.push(Math.abs(Math.atan2(a.x*b.z-a.z*b.x,a.x*b.x+a.z*b.z)));}
  TR={curve,N,P,T,L,K,len:curve.getLength()};
}
function nearest(x,z,guess){
  let best=guess,bd=1e18;const N=TR.N;
  const scan=(from,cnt)=>{for(let k=0;k<cnt;k++){const i=((from+k)%N+N)%N,p=TR.P[i],d=(p.x-x)**2+(p.z-z)**2;if(d<bd){bd=d;best=i;}}};
  if(guess==null)scan(0,N);else scan(guess-60,120);
  const p=TR.P[best],l=TR.L[best];const lat=(x-p.x)*l.x+(z-p.z)*l.z;
  return{i:best,lat,d:Math.sqrt(bd)};
}
// ---- 3D ----
let renderer,scene,camera,sun;
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=4;return t;}
function initScene(){
  const cv=$('#gl');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;
  scene=new THREE.Scene();
  // 空
  const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v;void main(){float h=max(v.y,0.);vec3 top=vec3(.13,.24,.55),mid=vec3(.55,.55,.8),hor=vec3(1.,.72,.45);vec3 c=mix(hor,mid,smoothstep(0.,.18,h));c=mix(c,top,smoothstep(.15,.7,h));vec3 sd=normalize(vec3(.55,.12,.75));float sd2=max(dot(v,sd),0.);c+=vec3(1.,.75,.4)*pow(sd2,14.)*.9+vec3(1.,.95,.8)*pow(sd2,600.)*4.;if(v.y<0.)c=mix(hor*.6,vec3(.25,.3,.25),min(1.,-v.y*4.));gl_FragColor=vec4(c,1.);}'}));
  sky.name='sky';
  scene.add(sky);
  scene.fog=new THREE.Fog(0xd9a882,320,1300);
  camera=new THREE.PerspectiveCamera(62,1,.5,2500);
  scene.add(new THREE.HemisphereLight(0xcfe0ff,0x6a5a3a,.45));
  sun=new THREE.DirectionalLight(0xffd9a8,1.5);sun.position.set(160,90,210);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=-70;sc.right=70;sc.top=70;sc.bottom=-70;sc.near=10;sc.far=500;sun.shadow.bias=-.0005;
  scene.add(sun);scene.add(sun.target);
  // 地面
  const grassT=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#4f9a3a';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle=`rgba(${30+Math.random()*60|0},${110+Math.random()*60|0},${30+Math.random()*30|0},.5)`;g.fillRect(Math.random()*w,Math.random()*h,2,2);}},true);
  grassT.repeat.set(120,120);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({map:grassT}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);
  buildRoad();buildScenery();
  // 映り込み(空から環境マップを作る)
  try{const pm=new THREE.PMREMGenerator(renderer);const es=new THREE.Scene();es.add(sky.clone());
    const panel=(c,x,y,z,w,h)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m);};
    panel(0xffffff,0,600,0,900,900);panel(0xffe2b8,700,200,500,500,120);panel(0x9fb6ff,-700,250,-300,600,150);panel(0x333a33,0,-400,0,2000,2000);
    envMap=pm.fromScene(es,.02).texture;scene.environment=envMap;pm.dispose();}catch(e){}
  setupPost();
}
function setupPost(){
  composer=null;bloom=null;
  if(!HQ||!THREE.EffectComposer||!THREE.UnrealBloomPass)return;
  try{composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),.32,.3,.95);composer.addPass(bloom);resize();}catch(e){composer=null;}
}
function buildRoad(){

function physics(r,dt,inp){
  const S=r.S;

  const off=Math.abs(q.lat)>ROADW/2+1;
  const bst=r.boost>0?1:0;const maxV=S.max*(off?.55:1)*(1+.32*bst);

  if(inp.nitro&&r.nitro>=100&&!r.boost){r.boost=3;r.nitro=0;if(r===me){tone(200,900,.6,'sawtooth',.08);speak('ニトロ');}}
  if(r.boost>0)r.boost=Math.max(0,r.boost-dt);else r.nitro=Math.min(100,r.nitro+dt*(off?2:7));
  if(inp.brake)a-=r.v>0?S.acc*2.2:S.acc*.6;

  const q2=nearest(r.x,r.z,q.i);const lim=ROADW/2+8.3;

    const t=TR.T[q2.i];const th=Math.atan2(t.x,t.z);let dh=th-r.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));if(Math.abs(dh)<Math.PI/2)r.h+=dh*.25;
    if(r.v>12){r.v*=.6;if(r===me){crash();r.shake=.4;}}else r.v*=.9;}
  // 周回
  r.idx=q2.i;const N=TR.N;
  if(r.idx>N*.45&&r.idx<N*.55)r.half=true;
  if(r.lastIdx>N*.9&&r.idx<N*.1&&r.half){r.lap++;r.half=false;if(r===me)onLap();}
  if(r.lastIdx<N*.1&&r.idx>N*.9&&r.lap>0&&!r.half){/* 逆走で戻った */}
  r.lastIdx=r.idx;
  r.prog=r.lap*N+r.idx-(r.idx>N*.9&&!r.half&&r.lap===0?N:0);
  r.off=off;

  if(!off&&Math.abs(r.steer)>.7&&Math.abs(r.v)>28&&Math.random()<.5){const bx=r.x-Math.sin(r.h)*S.len*.35,bz=r.z-Math.cos(r.h)*S.len*.35;smoke(bx,bz);}
  if(off&&Math.abs(r.v)>15&&Math.random()<.3)smoke(r.x,r.z);
}
function cpuInput(r){
  const N=TR.N,look=Math.round(14+r.v*.7);const ti=(r.idx+look)%N,p=TR.P[ti],l=TR.L[ti];
  const lane=r.lane+Math.sin(raceT*.3+r.seed)*1.5;
  const tx=p.x+l.x*lane,tz=p.z+l.z*lane;
  let want=Math.atan2(tx-r.x,tz-r.z),dh=want-r.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));
  let curv=0;for(let k=0;k<70;k+=5)curv=Math.max(curv,TR.K[(r.idx+k+Math.round(r.v*.5))%N]);
  const skill=[.78,.9,.99][LV]*r.skill;
  const vt=r.S.max*skill*Math.max(.42,1-curv*5.2);

}
function collide(){

    const a=racers[i],b=racers[j];const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    const ra=(a.S.len+a.S.wid)/4,rb=(b.S.len+b.S.wid)/4,min=ra+rb;

function frame(t){

    if(phase==='count'){const b=Math.ceil(countT);countT-=dt;if(Math.ceil(countT)!==b&&countT>0){banner(String(Math.ceil(countT)),700,'#ffcf3a');tone(520,520,.15,'square',.06);}

    if(phase==='race'){
      raceT+=dt;
      for(const r of racers){
        if(r.remote)continue;
        if(r===me){physics(r,dt,me.fin!=null?{acc:false,brake:true,steer:0}:(window.__autoMe?cpuInput(r):myInput()));}
        else if(r.cpu&&(HOST||!ONLINE)){physics(r,dt,r.fin!=null?{acc:true,brake:false,steer:cpuInput(r).steer}:cpuInput(r));if(r.lap>=LAPS&&r.fin==null)r.fin=raceT;}
      }
      collide();
      if(ONLINE&&t-lastSend>100){lastSend=t;sendState(false);}
    }
    me.shake=Math.max(0,me.shake-dt);
    racers.forEach(r=>syncObj(r,dt));
    updateCamera(dt,false);
    engineSet(Math.abs(me.v)/me.S.max,phase==='race');

$('#nm').addEventListener('change',()=>{try{localStorage.setItem('kk_name',$('#nm').value);}catch(e){}});
// ---- インターネット対戦 ----
let LOBBY=[];
const net={ch:null,
  available(){return !!(window.KK_CONFIG&&window.KK_CONFIG.url&&window.supabase)||/[?&]local=1/.test(location.search);},
  open(code,host){
    this.leave();HOST=host;ONLINE=true;this.code=code;const on=(ev,p)=>this.recv(ev,p);
    if(/[?&]local=1/.test(location.search)){const bc=new BroadcastChannel('race-'+code);bc.onmessage=e=>on(e.data.ev,e.data.p);this.ch={send:(ev,p)=>bc.postMessage({ev,p}),close:()=>bc.close()};if(!host)this.hello();return;}
    const cfg=window.KK_CONFIG;if(!this.sb)this.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{realtime:{params:{eventsPerSecond:40}}});
    const c=this.sb.channel('kk-race-'+code,{config:{broadcast:{self:false},presence:{key:ME.id}}});
    ['hello','lobby','start','st','cpu','bye'].forEach(ev=>c.on('broadcast',{event:ev},m=>on(ev,m.payload)));
    c.on('presence',{event:'leave'},({key})=>on('bye',{id:key}));
    c.subscribe(st=>{if(st==='SUBSCRIBED'){c.track({n:1});if(!host)this.hello();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')$('#lobst').textContent='つながりませんでした。もう一度 ためしてね';});
    this.ch={send:(ev,p)=>c.send({type:'broadcast',event:ev,payload:p}),close:()=>this.sb.removeChannel(c)};
  },
  hello(){clearInterval(this.ht);const f=()=>{if(LOBBY.some(p=>p.id===ME.id))return;this.send('hello',{id:ME.id,name:ME.name,car:ME.car,color:ME.color});};f();this.ht=setInterval(f,1500);},
  send(ev,p){try{this.ch&&this.ch.send(ev,p);}catch(e){}},
  leave(){clearInterval(this.ht);if(this.ch){try{this.send('bye',{id:ME.id});this.ch.close();}catch(e){}}this.ch=null;ONLINE=false;LOBBY=[];},
  recv(ev,p){
    if(ev==='hello'&&HOST){const ex=LOBBY.find(x=>x.id===p.id);if(ex)Object.assign(ex,p);else if(LOBBY.length<6)LOBBY.push(p);this.send('lobby',{list:LOBBY});lobbyShow();}
    else if(ev==='lobby'&&!HOST){LOBBY=p.list;lobbyShow();}
    else if(ev==='start'&&!HOST){startRace(p.list.map(o=>({...o,self:o.id===ME.id,remote:o.id!==ME.id})));}
    else if(ev==='st'){const r=racers.find(x=>x.id===p.id);if(r&&r.remote){r.tx=p.x;r.tz=p.z;r.th=p.h;r.v=p.v;r.steer=p.s;r.lap=p.l;r.prog=p.p;r.boost=p.b?1:0;if(p.f!=null)r.fin=p.f;if(Math.hypot(r.x-p.x,r.z-p.z)>30){r.x=p.x;r.z=p.z;}}}
    else if(ev==='cpu'&&!HOST){p.a.forEach(q=>{const r=racers.find(x=>x.id===q.id);if(r){r.tx=q.x;r.tz=q.z;r.th=q.h;r.v=q.v;r.steer=q.s;r.lap=q.l;r.prog=q.p;r.boost=q.b?1:0;if(q.f!=null)r.fin=q.f;}});}
    else if(ev==='bye'){const r=racers.find(x=>x.id===p.id);if(r&&HOST&&r.remote){r.remote=false;r.cpu=true;r.name+='(CPU)';}
      if(phase!=='race'&&phase!=='count'){LOBBY=LOBBY.filter(x=>x.id!==p.id);if(HOST){this.send('lobby',{list:LOBBY});lobbyShow();}}}
  }
};
function sendState(force){
  const r=me;net.send('st',{id:r.id,x:+r.x.toFixed(2),z:+r.z.toFixed(2),h:+r.h.toFixed(3),v:+r.v.toFixed(1),s:+r.steer.toFixed(2),l:r.lap,p:r.prog,f:r.fin,b:r.boost>0?1:0});
  if(HOST){const a=racers.filter(x=>x.cpu).map(x=>({id:x.id,x:+x.x.toFixed(2),z:+x.z.toFixed(2),h:+x.h.toFixed(3),v:+x.v.toFixed(1),s:+x.steer.toFixed(2),l:x.lap,p:x.prog,f:x.fin,b:x.boost>0?1:0}));if(a.length)net.send('cpu',{a});}
}
function lobbyShow(){
  document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'));$('#lobby').classList.add('show');$('#lobcode').textContent=net.code;
  $('#loblist').innerHTML=LOBBY.map((p,i)=>`<li>${i===0?'👑 ':''}<i style="background:${PALETTE[p.color%PALETTE.length]}"></i>${p.name} <small>${CARS[p.car]?.name||''}</small>${p.id===ME.id?'（あなた）':''}</li>`).join('')+Array(Math.max(0,6-LOBBY.length)).fill('<li class="empty">あき（コンピュータ）</li>').join('');
  $('#lobstart').style.display=HOST?'':'none';$('#lobcpu').style.display=HOST?'':'none';$('#lobwait').style.display=HOST?'none':'block';
}
function hostStart(){
  const n=+$('#lobcpu').dataset.n;const types=Object.keys(CARS);
  const list=LOBBY.map(p=>({id:p.id,name:p.name,car:p.car,color:p.color}));
  let k=0;while(list.length<n)list.push({id:'cpu'+k,name:CPUN[k],car:types[(k*3+1)%types.length],color:(k+3)%PALETTE.length,cpu:true}),k++;
  net.send('start',{list});
  startRace(list.map(o=>({...o,self:o.id===ME.id,remote:!o.cpu&&o.id!==ME.id})));
}

  ME.name=myName();const code=String(Math.floor(1000+Math.random()*9000));net.open(code,true);LOBBY=[{id:ME.id,name:ME.name,car:ME.car,color:ME.color}];lobbyShow();};
