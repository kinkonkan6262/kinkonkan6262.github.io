<script>
if(!window.THREE){document.body.innerHTML='<p style="padding:20px">3Dが よみこめませんでした。インターネットに つないで ひらきなおしてね。</p>';}
else{
// ===== きんこんかん島 =====
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const ME={id:Math.random().toString(36).slice(2,10)};
const R=112; // 島の半径(草地)
// 土地(20区画): 東がわ
const LOTS=[];for(let r=0;r<5;r++)for(let c=0;c<4;c++)LOTS.push({i:LOTS.length,cx:44+c*14,cz:-30+r*14});
const LOTW=12;const inLotArea=(x,z)=>x>36&&x<104&&z<-22+5*14-6&&z>-38;
let renderer,scene,camera,sun,hemi,clock=new THREE.Clock();
// ---- 保存 ----
const KEY='kk_island_v1';
let SAVE={name:'',ap:{skin:0,hair:1,hairC:2,shirt:0,pants:1,hat:0},bag:{},coins:300,book:{},seeds:{},lots:{}};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
SAVE.seeds=SAVE.seeds||{};SAVE.lots=SAVE.lots||{};
let OWNER='';try{OWNER=localStorage.getItem('kk_island_owner')||'';if(!OWNER){OWNER=Array.from(crypto.getRandomValues(new Uint8Array(18))).map(b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('kk_island_owner',OWNER);}}catch(e){OWNER='x'+Math.random().toString(36).slice(2);}
try{if(!SAVE.name)SAVE.name=localStorage.getItem('kk_name')||'';}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}};
// ---- 音 ----
let AC=null,soundOn=true;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f1,f2,d,type='sine',v=.07,delay=0){if(!soundOn)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}catch(e){}}
function noiseHit(d,f,v){if(!soundOn)return;try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();bp.type='bandpass';bp.frequency.value=f;s.buffer=b;g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();}catch(e){}}
const sfx={step(){noiseHit(.05,900,.05);},pop(){tone(600,1200,.08,'sine',.08);},get(){[784,988,1175].forEach((f,k)=>tone(f,f,.12,'triangle',.07,k*.07));},
  splash(){noiseHit(.3,700,.25);},rustle(){noiseHit(.4,2500,.12);},coin(){tone(1300,1300,.06,'square',.04);tone(1750,1750,.12,'square',.04,.06);},
  big(){[523,659,784,1047,1319].forEach((f,k)=>tone(f,f,.18,'triangle',.08,k*.09));},talk(){for(let k=0;k<4;k++)tone(rnd(400,800),rnd(400,800),.05,'square',.025,k*.06);}};
function speak(t){if(!soundOn)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
// ---- 見た目の色 ----
const SKIN=['#f6d2b4','#e8b48c','#c98d62','#8d5a3b'];
const HAIRC=['#2b2320','#6b3e1f','#d9a441','#c0392b','#e57fb0','#3b6fd8','#eeeeee'];
const CLOTH=['#ff6b6b','#4dabf7','#51cf66','#ffd43b','#b197fc','#ff922b','#f1f3f5','#343a40','#20c997','#f783ac'];
const HATS=['なし','むぎわら','キャップ','ニット','はな'];
const HAIRS=['ショート','ボブ','ツインテール','ぼうず'];
// ---- テクスチャ ----
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function lam(c,o={}){return new THREE.MeshLambertMaterial({color:c,...o});}
// ---- キャラクター(オリジナル) ----
function makeAvatar(ap,name){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const skin=lam(SKIN[ap.skin%4]),hairM=lam(HAIRC[ap.hairC%HAIRC.length]),shirt=lam(CLOTH[ap.shirt%CLOTH.length]),pants=lam(CLOTH[ap.pants%CLOTH.length]),shoe=lam(0x5a3a28),black=new THREE.MeshBasicMaterial({color:0x1b1b1b}),white=new THREE.MeshBasicMaterial({color:0xffffff}),blush=new THREE.MeshBasicMaterial({color:0xff9aa8,transparent:true,opacity:.7});
  const mk=(geo,m,x,y,z,parent=body)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;};
  // 足
  const legs=[];for(const s of [-1,1]){const lg=new THREE.Group();lg.position.set(s*.16,.55,0);body.add(lg);mk(new THREE.CylinderGeometry(.1,.11,.45,10),pants,0,-.22,0,lg);mk(new THREE.SphereGeometry(.13,10,8),shoe,0,-.47,.05,lg).scale.set(1,.6,1.4);legs.push(lg);}
  // 体
  mk(new THREE.CylinderGeometry(.27,.33,.6,14),shirt,0,.85,0);
  mk(new THREE.SphereGeometry(.27,14,10,0,Math.PI*2,0,Math.PI/2),shirt,0,1.14,0).scale.y=.45;
  // うで
  const arms=[];for(const s of [-1,1]){const am=new THREE.Group();am.position.set(s*.33,1.1,0);body.add(am);mk(new THREE.CylinderGeometry(.075,.07,.45,8),shirt,0,-.2,0,am);mk(new THREE.SphereGeometry(.085,8,6),skin,0,-.45,0,am);am.rotation.z=s*.12;arms.push(am);}
  // 頭
  const head=new THREE.Group();head.position.y=1.62;body.add(head);
  mk(new THREE.SphereGeometry(.48,20,16),skin,0,0,0,head);
  for(const s of [-1,1]){mk(new THREE.SphereGeometry(.065,10,8),black,s*.17,-.02,.44,head).scale.set(1,1.35,.5);mk(new THREE.SphereGeometry(.022,6,4),white,s*.15,.03,.475,head);mk(new THREE.CircleGeometry(.07,12),blush,s*.27,-.13,.405,head).lookAt(s*2,-.5,5);}
  mk(new THREE.SphereGeometry(.035,8,6),lam(0xd98a6a),0,-.09,.47,head);
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.05,.012,6,12,Math.PI),black);mouth.position.set(0,-.17,.45);mouth.rotation.z=Math.PI;head.add(mouth);
  // 髪
  const hs=ap.hair%HAIRS.length;
  if(hs!==3){const cap=mk(new THREE.SphereGeometry(.51,20,14,0,Math.PI*2,0,Math.PI*.5),hairM,0,.04,-.02,head);cap.rotation.x=-.32;
    if(hs===0){mk(new THREE.BoxGeometry(.7,.16,.25),hairM,0,.26,.33,head).rotation.x=.5;}
    if(hs===1){mk(new THREE.SphereGeometry(.53,18,12,Math.PI/2+1.0,Math.PI*2-2.0,Math.PI*.3,Math.PI*.42),hairM,0,-.04,-.03,head);mk(new THREE.BoxGeometry(.75,.14,.2),hairM,0,.24,.35,head).rotation.x=.4;}
    if(hs===2){for(const s of [-1,1]){mk(new THREE.SphereGeometry(.17,10,8),hairM,s*.5,.0,-.12,head).scale.set(.8,1.4,.8);}mk(new THREE.BoxGeometry(.7,.15,.22),hairM,0,.25,.34,head).rotation.x=.45;}
  }else{mk(new THREE.SphereGeometry(.49,18,12,0,Math.PI*2,0,Math.PI*.5),hairM,0,.01,0,head).material=lam(new THREE.Color(HAIRC[ap.hairC%HAIRC.length]).lerp(new THREE.Color(SKIN[ap.skin%4]),.5));}
  // 帽子
  const ht=ap.hat%HATS.length;
  if(ht===1){const st=lam(0xf2d27a);mk(new THREE.CylinderGeometry(.85,.85,.04,24),st,0,.32,0,head);mk(new THREE.CylinderGeometry(.36,.42,.3,18),st,0,.45,0,head);mk(new THREE.CylinderGeometry(.43,.43,.08,18),lam(0xe03131),0,.36,0,head);}
  if(ht===2){const cp=lam(CLOTH[(ap.shirt+3)%CLOTH.length]);mk(new THREE.SphereGeometry(.5,18,10,0,Math.PI*2,0,Math.PI*.5),cp,0,.12,0,head);mk(new THREE.BoxGeometry(.5,.04,.35),cp,0,.17,.45,head);}
  if(ht===3){const kn=lam(CLOTH[(ap.shirt+5)%CLOTH.length]);mk(new THREE.SphereGeometry(.52,18,12,0,Math.PI*2,0,Math.PI*.5),kn,0,.08,0,head);mk(new THREE.SphereGeometry(.12,10,8),lam(0xffffff),0,.62,0,head);}
  if(ht===4){for(let k=0;k<5;k++){const a=k/5*Math.PI*2;mk(new THREE.SphereGeometry(.09,8,6),lam(0xff8fab),.28+Math.cos(a)*.09,.33+Math.sin(a)*.09,.15,head);}mk(new THREE.SphereGeometry(.07,8,6),lam(0xffd43b),.28,.33,.18,head);}
  // かげ
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.45,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.02;g.add(sh);
  // 名前
  if(name!=null)setTag(g,name);
  g.userData={body,legs,arms,head,walk:0,emo:null,emoT:0};
  return g;
}
function setTag(g,name){
  if(g.userData&&g.userData.tag)g.remove(g.userData.tag);
  const t=canvasTex(256,64,(c,w,h)=>{c.fillStyle='rgba(255,255,255,.88)';c.beginPath();c.roundRect?c.roundRect(10,8,w-20,h-16,24):c.rect(10,8,w-20,h-16);c.fill();c.fillStyle='#3a3a3a';c.font='bold 32px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(name,w/2,h/2+1);});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));sp.scale.set(1.8,.45,1);sp.position.y=2.75;sp.renderOrder=5;g.add(sp);g.userData=g.userData||{};g.userData.tag=sp;
}
function bubble(g,text){
  const ud=g.userData;if(ud.bub)g.remove(ud.bub);
  const lines=[];let s=text;while(s.length>9){lines.push(s.slice(0,9));s=s.slice(9);}lines.push(s);
  const H=40+lines.length*44;
  const t=canvasTex(320,H+30,(c,w,h)=>{c.fillStyle='#fff';c.strokeStyle='#e0c88a';c.lineWidth=6;c.beginPath();c.roundRect?c.roundRect(6,6,w-12,H-6,30):c.rect(6,6,w-12,H-6);c.fill();c.stroke();c.beginPath();c.moveTo(w/2-16,H-2);c.lineTo(w/2,h-4);c.lineTo(w/2+16,H-2);c.fill();
    c.fillStyle='#4a3a20';c.font='bold 38px sans-serif';c.textAlign='center';c.textBaseline='middle';lines.forEach((l,i)=>c.fillText(l,w/2,30+i*44+12));});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));const sc=2.6;sp.scale.set(sc,sc*(H+30)/320,1);sp.position.y=3.2+sp.scale.y/2;sp.renderOrder=6;g.add(sp);ud.bub=sp;ud.bubT=5;
}
function animAvatar(g,dt,moving,speed=1){
  const u=g.userData;if(!u.body)return;
  if(moving){u.walk+=dt*10*speed;}else u.walk*=.8;
  const s=Math.sin(u.walk)*(moving?.7:0);

const net={ch:null,
  available(){return !!(window.KK_CONFIG&&window.KK_CONFIG.url&&window.supabase)||/[?&]local=1/.test(location.search);},
  open(){
    const on=(ev,p)=>this.recv(ev,p);
    if(/[?&]local=1/.test(location.search)){const bc=new BroadcastChannel('island');bc.onmessage=e=>on(e.data.ev,e.data.p);this.ch={send:(ev,p)=>bc.postMessage({ev,p})};return true;}
    if(!this.available())return false;
    const cfg=window.KK_CONFIG;this.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{realtime:{params:{eventsPerSecond:12}}});
    const c=this.sb.channel('kk-island-main',{config:{broadcast:{self:false},presence:{key:ME.id}}});
    ['p','say','emo','bye','poke','lots'].forEach(ev=>c.on('broadcast',{event:ev},m=>on(ev,m.payload)));
    c.on('presence',{event:'leave'},({key})=>on('bye',{id:key}));
    c.subscribe(st=>{if(st==='SUBSCRIBED'){c.track({n:SAVE.name});$('#online').textContent='🟢 オンライン';}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')$('#online').textContent='⚪ ひとりモード';});

  },

  recv(ev,p){
    if(p.id===ME.id)return;

      if(!o||o.apKey!==JSON.stringify(p.ap)+p.n){if(o)scene.remove(o.g);const g=makeAvatar(p.ap,p.n);scene.add(g);o={g,x:p.x,z:p.z,cx:p.x,cz:p.z,r:p.r,m:0,apKey:JSON.stringify(p.ap)+p.n};OTHERS.set(p.id,o);if(me)toast(`👋 ${p.n}さんが きました`);}

    else if(t.dead===2){t.back-=dt;if(t.back<=0){t.dead=0;t.hp=5;t.g.visible=true;t.g.rotation.set(0,0,0);t.stump.visible=false;SOLID.push(t.sol);t.fruits.forEach(f=>f.visible=true);}}
  }
  for(let i=FX.length-1;i>=0;i--){const s=FX[i],u=s.userData;u.l-=dt;s.position.x+=u.vx*dt;s.position.y+=u.vy*dt;s.position.z+=u.vz*dt;u.vy-=12*dt;s.rotation.y+=dt*8;if(u.l<=0){scene.remove(s);FX.splice(i,1);}}
  for(const r of ROCKS)if(r.userData.cool>0)r.userData.cool-=dt;
}
// ===================== ボール =====================
let ball=null;
function buildBall(){const tex=canvasTex(128,64,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#e03131';for(let k=0;k<6;k++){c.beginPath();c.arc(k*24+8,(k%2)*30+16,9,0,7);c.fill();}});
  const m=new THREE.Mesh(new THREE.SphereGeometry(.45,18,14),new THREE.MeshLambertMaterial({map:tex}));m.castShadow=true;scene.add(m);ball={m,x:4,z:-3,y:.45,vx:0,vy:0,vz:0};}
function stepBall(dt){if(!ball)return;const b=ball;
  // 歩いて ぶつかると かるく ころがる
  const d=Math.hypot(b.x-P.x,b.z-P.z);if(d<.9&&P.v>0){b.vx+=Math.sin(P.r)*4;b.vz+=Math.cos(P.r)*4;}
  b.x+=b.vx*dt;b.z+=b.vz*dt;b.vy-=18*dt;b.y+=b.vy*dt;const g=Math.max(-.2,hgt(b.x,b.z))+.45;if(b.y<g){b.y=g;b.vy=Math.abs(b.vy)>2?-b.vy*.45:0;}
  const fr=b.y<=g+.01?.985:.997;b.vx*=fr;b.vz*=fr;
  for(const s of SOLID){const dx=b.x-s.x,dz=b.z-s.z,dd=Math.hypot(dx,dz),mm=s.r+.45;if(dd<mm&&dd>.01){const nx=dx/dd,nz=dz/dd;b.x=s.x+nx*mm;b.z=s.z+nz*mm;const vn=b.vx*nx+b.vz*nz;if(vn<0){b.vx-=1.7*vn*nx;b.vz-=1.7*vn*nz;tone(300,250,.05,'sine',.04);}}}
  const r=Math.hypot(b.x,b.z);if(r>R){b.x*=R/r;b.z*=R/r;b.vx*=-.5;b.vz*=-.5;}
  b.m.position.set(b.x,b.y,b.z);b.m.rotation.x+=b.vz*dt/.45;b.m.rotation.z-=b.vx*dt/.45;}
// ===================== 土地・家・畑 =====================
const CROPS={kabu:{n:'かぶ',seed:50,min:3,c:0xffffff},ninjin:{n:'にんじん',seed:80,min:5,c:0xff8c1a},tomato:{n:'トマト',seed:120,min:8,c:0xe03131},ichigo:{n:'いちご',seed:200,min:10,c:0xff4d6d},kabocha:{n:'かぼちゃ',seed:300,min:15,c:0xf08c00}};
const LOT_PRICE=1000,HOUSE_COIN=2000,HOUSE_WOOD=20,MAX_LOTS=2;
const HCOL=[0xffe3e3,0xe7f5ff,0xebfbee,0xfff4e6,0xf3f0ff],RCOL=[0xe03131,0x1c7ed6,0x2f9e44,0xe8590c,0x7048e8];
let LOTDATA={}; // i -> {name,mine,data:{house:{c},crops:[{t,p}|null x8]}}
const LOTG=[];
function tilePos(L,k){const row=Math.floor(k/4),col=k%4;return{x:L.cx-3.6+row*1.9,z:L.cz-3.3+col*2.2};}
function buildLots(){
  for(const L of LOTS){const g=new THREE.Group();scene.add(g);LOTG[L.i]=g;}
  LOTS.forEach(L=>renderLot(L.i));
}
function signTex(lines,bg){return canvasTex(256,128,(c,w,h)=>{c.fillStyle='#8a5a3b';c.fillRect(0,0,w,h);c.fillStyle=bg;c.fillRect(8,8,w-16,h-16);c.fillStyle='#4a3a20';c.textAlign='center';c.textBaseline='middle';c.font='bold 34px sans-serif';c.fillText(lines[0],w/2,44);c.font='bold 26px sans-serif';c.fillText(lines[1]||'',w/2,90);});}
function renderLot(i){
  const L=LOTS[i],g=LOTG[i];if(!g)return;while(g.children.length)g.remove(g.children[0]);
  const D=LOTDATA[i];const y=hgt(L.cx,L.cz);
  // かんばん
  const sg=new THREE.Group();const board=new THREE.Mesh(new THREE.BoxGeometry(1.8,.9,.1),new THREE.MeshLambertMaterial({map:signTex(D?[D.name+'の とち',D.mine?'（あなた）':'']:[`とち ${i+1}`,`${LOT_PRICE}コイン`],D?(D.mine?'#d3f9d8':'#fff3bf'):'#ffffff')}));board.position.y=1.3;sg.add(board);
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.3,6),lam(0x8a5a3b));post.position.y=.65;sg.add(post);
  sg.position.set(L.cx-LOTW/2+.4,y,L.cz-4.5);sg.rotation.y=-Math.PI/2;g.add(sg);
  if(!D)return;
  // さく
  const fm=lam(0xf1e3c6);const half=LOTW/2-.3;
  const rail=(x1,z1,x2,z2)=>{const len=Math.hypot(x2-x1,z2-z1),n=Math.max(2,Math.round(len/1.5));for(let k=0;k<=n;k++){const t=k/n,p=new THREE.Mesh(new THREE.BoxGeometry(.12,.7,.12),fm);p.position.set(L.cx+x1+(x2-x1)*t,y+.35,L.cz+z1+(z2-z1)*t);g.add(p);}
    const r=new THREE.Mesh(new THREE.BoxGeometry(.06,.08,len),fm);r.position.set(L.cx+(x1+x2)/2,y+.55,L.cz+(z1+z2)/2);r.rotation.y=Math.atan2(x2-x1,z2-z1);g.add(r);};
  rail(-half,-half,-half,-1.2);rail(-half,1.2,-half,half);rail(-half,half,half,half);rail(half,half,half,-half);rail(half,-half,-half,-half);
  // 畑
  const soil=lam(0x7a5233),soilWet=lam(0x5e3d24);
  const crops=(D.data&&D.data.crops)||[];
  for(let k=0;k<8;k++){const tp=tilePos(L,k);const cr=crops[k];const t=new THREE.Mesh(new THREE.BoxGeometry(1.6,.18,1.9),cr?soilWet:soil);t.position.set(tp.x,y+.09,tp.z);t.receiveShadow=true;g.add(t);
    if(cr){const cg=new THREE.Group();cg.position.set(tp.x,y+.18,tp.z);g.add(cg);cg.userData={crop:cr,k};drawCrop(cg,cr);}}
  // 家
  if(D.data&&D.data.house){const c=D.data.house.c%HCOL.length;const hg=new THREE.Group();const w=4.2,h=3.4;
    const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h*.6,w*.85),lam(HCOL[c]));wall.position.y=h*.3;wall.castShadow=true;hg.add(wall);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(w*.82,h*.55,4),lam(RCOL[c]));roof.position.y=h*.87;roof.rotation.y=Math.PI/4;roof.castShadow=true;hg.add(roof);
    const door=new THREE.Mesh(new THREE.BoxGeometry(.1,h*.35,w*.22),lam(0x8a5a3b));door.position.set(-w/2-.03,h*.175,0);hg.add(door);
    for(const s of [-1,1]){const wd=new THREE.Mesh(new THREE.BoxGeometry(.1,w*.18,w*.2),new THREE.MeshLambertMaterial({color:0xbfe6ff,emissive:scene.userData.night?0xffd27a:0}));wd.position.set(-w/2-.03,h*.38,s*w*.3);hg.add(wd);(scene.userData.wins=scene.userData.wins||[]).push(wd.material);}
    const ch=new THREE.Mesh(new THREE.BoxGeometry(.5,1,.5),lam(0x868e96));ch.position.set(.8,h*1.0,.9);hg.add(ch);
    hg.position.set(L.cx+3.2,y,L.cz);g.add(hg);}
}
function drawCrop(cg,cr){
  while(cg.children.length)cg.remove(cg.children[0]);
  const C=CROPS[cr.t];const st=cropStage(cr);const leaf=lam(0x40c057);
  if(st===0){const s=new THREE.Mesh(new THREE.ConeGeometry(.08,.25,5),leaf);s.position.y=.12;cg.add(s);}
  else{for(let k=0;k<(st===1?3:5);k++){const l=new THREE.Mesh(new THREE.SphereGeometry(st===1?.14:.2,6,4),leaf);const a=k/5*6.28;l.position.set(Math.cos(a)*.18,.18+(st-1)*.12,Math.sin(a)*.18);l.scale.y=.5;cg.add(l);}}
  if(st>=2){const ripe=st===3;const col=ripe?C.c:0x8ce99a;const sz=ripe?1:.6;
    if(cr.t==='kabocha'){const f=new THREE.Mesh(new THREE.SphereGeometry(.42*sz,12,8),lam(col));f.scale.y=.7;f.position.set(.25,.25,0);cg.add(f);}
    else if(cr.t==='kabu'){const f=new THREE.Mesh(new THREE.SphereGeometry(.24*sz,10,8),lam(ripe?0xf8f9fa:col));f.position.y=.15;cg.add(f);}
    else if(cr.t==='ninjin'){const f=new THREE.Mesh(new THREE.ConeGeometry(.13*sz,.5,8),lam(col));f.rotation.x=Math.PI;f.position.y=.15;cg.add(f);}
    else{for(let k=0;k<4;k++){const f=new THREE.Mesh(new THREE.SphereGeometry((cr.t==='ichigo'?.09:.13)*sz,8,6),lam(col));const a=k/4*6.28+.4;f.position.set(Math.cos(a)*.25,.32,Math.sin(a)*.25);cg.add(f);}}
    if(ripe){const sp=new THREE.Mesh(new THREE.OctahedronGeometry(.1),new THREE.MeshBasicMaterial({color:0xffe066}));sp.position.y=1;sp.userData.spark=1;cg.add(sp);}}
  cg.userData.st=st;
}
function cropStage(cr){const m=(Date.now()-cr.p)/60000/CROPS[cr.t].min;return m>=1?3:m>=.6?2:m>=.25?1:0;}
let lotT=0;
function stepLots(dt){lotT+=dt;const t=performance.now()/1000;
  for(const g of LOTG){if(!g)continue;for(const c of g.children){if(c.userData&&c.userData.crop){if(lotT>2){const st=cropStage(c.userData.crop);if(st!==c.userData.st)drawCrop(c,c.userData.crop);}c.children.forEach(x=>{if(x.userData.spark){x.position.y=1+Math.sin(t*3)*.15;x.rotation.y=t*2;}});}}}
  if(lotT>2)lotT=0;}
function myLotHere(){for(const L of LOTS){if(Math.abs(P.x-L.cx)<LOTW/2&&Math.abs(P.z-L.cz)<LOTW/2)return L;}return null;}
function lotAction(){
  // かんばん
  for(const L of LOTS){const sx=L.cx-LOTW/2+.4,sz=L.cz-4.5;if(Math.hypot(P.x-sx,P.z-sz)<1.8){const D=LOTDATA[L.i];
    if(!D)return{label:`とちを かう ${LOT_PRICE}🪙`,run:()=>buyLot(L)};
    return{label:D.mine?'じぶんの とち 🏡':`${D.name}さんの とち`,run:()=>bubble(meObj,D.mine?'ここは わたしの とち！':`${D.name}さんの とちだ`)};}}
  const L=myLotHere();if(!L)return null;const D=LOTDATA[L.i];if(!D||!D.mine)return null;
  const data=D.data=D.data||{};data.crops=data.crops||[];
  // 家
  if(Math.hypot(P.x-(L.cx+3.2),P.z-L.cz)<3.4){if(!data.house)return{label:`いえを たてる 🔨`,run:()=>buildHouseOn(L)};return{label:'いえの いろ 🎨',run:()=>{data.house.c=(data.house.c+1)%HCOL.length;saveLot(L);renderLot(L.i);}};}
  // 畑
  for(let k=0;k<8;k++){const tp=tilePos(L,k);if(Math.abs(P.x-tp.x)<.95&&Math.abs(P.z-tp.z)<1.05){const cr=data.crops[k];
    if(!cr)return{label:'たねを まく 🌱',run:()=>plantMenu(L,k)};
    const st=cropStage(cr);if(st===3)return{label:`しゅうかく ${ITEMS[cr.t].e}`,run:()=>{data.crops[k]=null;const n=cr.t==='kabocha'?1:(cr.t==='ichigo'||cr.t==='tomato'?3:2);addItem(cr.t,n);sfx.get();bigCard(ITEMS[cr.t].e,`${ITEMS[cr.t].n}を ${n}こ しゅうかく！`,`1こ ${ITEMS[cr.t].p}コイン`);saveLot(L);renderLot(L.i);}};
    const left=Math.ceil((CROPS[cr.t].min*60000-(Date.now()-cr.p))/60000);return{label:`そだちちゅう あと${left}ぷん`,run:()=>toast(`${CROPS[cr.t].n}: あと やく${left}ぷん`)};}}
  return null;
}
async function buyLot(L){
  const mine=Object.values(LOTDATA).filter(d=>d.mine).length;
  if(mine>=MAX_LOTS){bubble(meObj,`とちは ${MAX_LOTS}つまで`);return;}
  if(SAVE.coins<LOT_PRICE){bubble(meObj,`コインが たりない…（${LOT_PRICE}ひつよう）`);return;}
  const ok=await srv('kk_island_claim',{p_lot:L.i,p_owner:OWNER,p_name:SAVE.name});
  if(ok&&ok.ok===false){toast('ほかの人が さきに かいました');loadLots();return;}
  SAVE.coins-=LOT_PRICE;LOTDATA[L.i]={name:SAVE.name,mine:true,data:{crops:[]}};SAVE.lots[L.i]=LOTDATA[L.i].data;save();updateHud();renderLot(L.i);
  sfx.big();bigCard('🏡',`とち ${L.i+1}を かった！`,'いえを たてたり はたけを つくろう');speak('とちを かいました');net.send('lots',{});
}
function buildHouseOn(L){
  const wood=SAVE.bag.wood||0;
  if(wood<HOUSE_WOOD||SAVE.coins<HOUSE_COIN){bubble(meObj,`もくざい ${HOUSE_WOOD}こ と ${HOUSE_COIN}コイン ひつよう（いま 🪵${wood}）`);return;}
  SAVE.bag.wood-=HOUSE_WOOD;if(!SAVE.bag.wood)delete SAVE.bag.wood;SAVE.coins-=HOUSE_COIN;
  const D=LOTDATA[L.i];D.data.house={c:Math.floor(Math.random()*HCOL.length)};saveLot(L);renderLot(L.i);updateHud();
  for(let k=0;k<5;k++)setTimeout(()=>{tone(300,200,.08,'square',.06);stars(L.cx+3.2,2,L.cz);},k*200);
  setTimeout(()=>{sfx.big();bigCard('🏠','いえが たった！','いえの まえで いろを かえられるよ');speak('いえが たちました');},1100);
}
function plantMenu(L,k){
  const have=Object.keys(CROPS).filter(c=>SAVE.seeds[c]>0);
  if(!have.length){bubble(meObj,'たねが ない… おみせで かおう');return;}
  $('#panel').innerHTML=`<h3>🌱 どの たねを まく？</h3><div class="shop">${have.map(c=>`<button data-c="${c}">${ITEMS[c].e} ${CROPS[c].n}<small>のこり ${SAVE.seeds[c]}こ ／ ${CROPS[c].min}ぷんで しゅうかく</small></button>`).join('')}</div><button class="btn" id="pclose">とじる</button>`;
  $('#panel').classList.add('show');$('#pclose').onclick=()=>$('#panel').classList.remove('show');
  $('#panel .shop').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;SAVE.seeds[c]--;const D=LOTDATA[L.i];D.data.crops[k]={t:c,p:Date.now()};save();saveLot(L);renderLot(L.i);$('#panel').classList.remove('show');tone(600,900,.1,'triangle',.07);toast(`🌱 ${CROPS[c].n}の たねを まいた`);};
}
// ---- おみせ ----
function openShop(tab){
  const sell=()=>{const ks=Object.keys(SAVE.bag);let sum=0;ks.forEach(k=>sum+=ITEMS[k].p*SAVE.bag[k]);
    return `<div class="shop">${ks.map(k=>`<button data-sell="${k}">${ITEMS[k].e} ${ITEMS[k].n} ×${SAVE.bag[k]}<small>1こ ${ITEMS[k].p}コイン</small></button>`).join('')||'<p>うるものが ないよ</p>'}</div>${ks.length?`<button class="btn" data-sellall="1">ぜんぶ うる（${sum.toLocaleString()}コイン）</button>`:''}`;};
  const buy=()=>`<div class="shop">${Object.keys(CROPS).map(c=>`<button data-buy="${c}">${ITEMS[c].e} ${CROPS[c].n}の たね<small>${CROPS[c].seed}コイン ／ もってる ${SAVE.seeds[c]||0}こ</small></button>`).join('')}</div><p class="sm">とちは ひがしの「とち」の かんばんで かえるよ（${LOT_PRICE}コイン）<br>いえは じぶんの とちで たてられるよ（🪵${HOUSE_WOOD}こ ＋ ${HOUSE_COIN}コイン）</p>`;
  const draw=()=>{$('#panel').innerHTML=`<h3>🛒 おみせ　🪙 ${SAVE.coins.toLocaleString()}</h3><div class="tabs"><button data-tab="sell" class="${tab==='sell'?'sel':''}">うる</button><button data-tab="buy" class="${tab==='buy'?'sel':''}">かう</button></div>${tab==='sell'?sell():buy()}<button class="btn" id="pclose">とじる</button>`;$('#pclose').onclick=()=>$('#panel').classList.remove('show');};
  draw();$('#panel').classList.add('show');
  $('#panel').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tab){tab=b.dataset.tab;draw();return;}
    if(b.dataset.sell){const k=b.dataset.sell;SAVE.coins+=ITEMS[k].p;SAVE.bag[k]--;if(!SAVE.bag[k])delete SAVE.bag[k];sfx.coin();save();updateHud();draw();return;}
    if(b.dataset.sellall){let sum=0;for(const k in SAVE.bag)sum+=ITEMS[k].p*SAVE.bag[k];SAVE.coins+=sum;SAVE.bag={};sfx.coin();setTimeout(sfx.coin,150);save();updateHud();draw();speak(`${sum}コインに なりました`);return;}
    if(b.dataset.buy){const c=b.dataset.buy;if(SAVE.coins<CROPS[c].seed){toast('コインが たりない');return;}SAVE.coins-=CROPS[c].seed;SAVE.seeds[c]=(SAVE.seeds[c]||0)+1;sfx.coin();save();updateHud();draw();return;}};
}
// ---- サーバー(みんなの とち) ----
function srv(fn,body){const c=window.KK_CONFIG;if(!c||!c.url)return Promise.resolve(null);const h={'apikey':c.anonKey,'Content-Type':'application/json'};if(/^eyJ/.test(c.anonKey||''))h.Authorization='Bearer '+c.anonKey;
  return fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)}).then(r=>r.ok?r.json():null).catch(()=>null);}
async function loadLots(){
  const res=await srv('kk_island_list',{p_owner:OWNER});
  if(Array.isArray(res)){const next={};res.forEach(r=>{next[r.lot]={name:r.name,mine:r.mine,data:r.data||{}};});
    // 自分の土地は 手元の記録を 優先
    for(const i in SAVE.lots){if(next[i]&&next[i].mine)next[i].data=SAVE.lots[i];}
    LOTDATA=next;}
  else{LOTDATA={};for(const i in SAVE.lots)LOTDATA[i]={name:SAVE.name,mine:true,data:SAVE.lots[i]};}
  LOTS.forEach(L=>renderLot(L.i));
}
let saveTimer={};
function saveLot(L){const D=LOTDATA[L.i];SAVE.lots[L.i]=D.data;save();clearTimeout(saveTimer[L.i]);saveTimer[L.i]=setTimeout(async()=>{await srv('kk_island_save',{p_lot:L.i,p_owner:OWNER,p_name:SAVE.name,p_data:D.data});net.send('lots',{});},600);}
setInterval(()=>{if(me)loadLots();},60000);
// ---- ミニマップ ----
const mapC=$('#map'),mctx=mapC.getContext('2d');
function drawMap(){
  const W=mapC.width,H=mapC.height,s=W/(R*2+20),X=x=>W/2+x*s,Z=z=>H/2+z*s;
  mctx.clearRect(0,0,W,H);mctx.fillStyle='#4fb8e0';mctx.beginPath();mctx.arc(W/2,H/2,W/2,0,7);mctx.fill();
  mctx.fillStyle='#f2dfa6';mctx.beginPath();mctx.arc(W/2,H/2,(R+1)*s,0,7);mctx.fill();mctx.fillStyle='#7cc25a';mctx.beginPath();mctx.arc(W/2,H/2,(R-2)*s,0,7);mctx.fill();
  for(const L of LOTS){const D=LOTDATA[L.i];mctx.fillStyle=D?(D.mine?'#ffd43b':'#c9a26b'):'#a9e08a';mctx.fillRect(X(L.cx-LOTW/2),Z(L.cz-LOTW/2),LOTW*s,LOTW*s);}
  mctx.fillStyle='#2f9e44';mctx.fillRect(X(shopPos.x)-4,Z(shopPos.z)-4,8,8);
  for(const [,o] of OTHERS){mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(X(o.cx),Z(o.cz),2.5,0,7);mctx.fill();}
  mctx.fillStyle='#ff4d4d';mctx.beginPath();mctx.arc(X(P.x),Z(P.z),4,0,7);mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=1.5;mctx.stroke();
}
$('#punch').addEventListener('pointerdown',e=>{e.preventDefault();hit('punch');});
$('#kick').addEventListener('pointerdown',e=>{e.preventDefault();hit('kick');});
window.addEventListener('keydown',e=>{if(e.code==='KeyJ')hit('punch');if(e.code==='KeyK')hit('kick');});

initScene();resize();dayNight();setInterval(dayNight,30000);editorShow();requestAnimationFrame(frame);
window.ISL={P,OTHERS,SAVE,action,contextAction,hit,LOTS,get LOTDATA(){return LOTDATA},TREES,openShop,lotAction,renderLot};

}
