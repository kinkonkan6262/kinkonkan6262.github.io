<script>

else{
// ===== きんこんかん島 =====
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];

const R=194; // 島の半径(草地) 3ばい
const RT=R-16; // せんろの 半径
const SI={x:-Math.SQRT1_2*(R+110),z:Math.SQRT1_2*(R+110),r:30}; // はなれじま
const STA=[{a:3*Math.PI/4+.1,n:'みなと まえ'},{a:-3*Math.PI/4,n:'もりの おく'},{a:-Math.PI/4,n:'はなばたけ'},{a:Math.PI/4+.35,n:'とちの まち'}];
const HARB={a:3*Math.PI/4};
function smooth(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function rayDist(x,z,a){const dx=Math.cos(a),dz=Math.sin(a);const t=x*dx+z*dz;if(t<10||t>RT)return 99;return Math.abs(-x*dz+z*dx);}
const BANK={x:-19,z:-19};
function nearInfra(x,z,m=0){const r=Math.hypot(x,z);if(Math.hypot(x+70,z-10)<16+m)return true;if(x>-82-m&&x<42+m&&z>67-m&&z<155+m)return true;if(x>-66-m&&x<66+m&&z>-172-m&&z<-50+m)return true;if(z>-92&&z<-18&&Math.abs(x)<6+m)return true;if(Math.hypot(x-BANK.x,z-BANK.z)<10+m)return true;if(Math.abs(r-RT)<6+m)return true;for(const st of STA)if(rayDist(x,z,st.a)<2.6+m)return true;
  const hx=Math.cos(HARB.a)*(R-6),hz=Math.sin(HARB.a)*(R-6);if(Math.hypot(x-hx,z-hz)<16+m)return true;return false;}
// 土地(20区画): 東がわ
const LOTS=[],LOTI={};const _addLot=(i,c,r,t)=>{const L={i,cx:44+c*14,cz:-30+r*14,t,f:c===7?1:-1};LOTS.push(L);LOTI[i]=L;};

// ---- 音 ----
let AC=null,soundOn=true;

function dayNight(){
  const d=NOW(),h=d.getHours()+d.getMinutes()/60;
  const day=Math.max(0,Math.min(1,Math.sin((h-6)/12*Math.PI)*1.4));
  const skyDay=new THREE.Color(0x8fd3ff),skyNight=new THREE.Color(0x101a3a),skyEve=new THREE.Color(0xffb27a);
  const eve=(h>16.5&&h<19)||(h>5&&h<7)?1-Math.abs(((h>12?17.75:6)-h))/1.25:0;
  const sky=skyNight.clone().lerp(skyDay,day).lerp(skyEve,Math.max(0,eve)*.6);
  scene.background=sky;scene.fog.color.copy(sky);
  sun.intensity=.15+day*.5;hemi.intensity=.32+day*.2;sun.color.set(eve>0?0xffc890:0xfff1d6);
  const night=day<.25;scene.userData.lampM.emissive.set(night?0xffd27a:0x000000);(scene.userData.wins||[]).forEach(m=>m.emissive.set(night?0xffd27a:0x000000));
  $('#clock').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ${night?'🌙':'☀️'}`;
  scene.userData.night=night;
}

  [x,z]=townBlock(x,z,rad);
  [x,z]=bizBlock(x,z,rad);
  [x,z]=clampWalk(x,z);

}

let netT=0,lastSent='';
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=performance.now()/1000;
  if(INDOOR){stepIndoor(dt,t);stepTrees(dt);requestAnimationFrame(frame);return;}
  if(me){
    // 移動
    let ix=JOY.x+((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0),iz=JOY.y+((K.ArrowDown||K.KeyS)?1:0)-((K.ArrowUp||K.KeyW)?1:0);
    const m=Math.min(1,Math.hypot(ix,iz));
    if(m>.1&&!fishing&&!BLOCK&&!RIDE){P.r=Math.atan2(ix,iz);const sp=(m>.75?7.5:3.2)*m*speedMul();[P.x,P.z]=resolve(P.x+Math.sin(P.r)*sp*dt,P.z+Math.cos(P.r)*sp*dt);P.v=sp;}else P.v=0;
    meObj.position.set(P.x,yAt(P.x,P.z),P.z);if(RIDE)rideFix();
    let dr=P.r-meObj.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));meObj.rotation.y+=dr*Math.min(1,dt*12);
    animAvatar(meObj,dt,P.v>0,P.v/4);
    if(P.v>0&&Math.floor(meObj.userData.walk/Math.PI)!==meObj.userData.lastStep){meObj.userData.lastStep=Math.floor(meObj.userData.walk/Math.PI);sfx.step();}
    // カメラ
    const tk=TALK?TALK.o:null,tx=tk?(P.x+tk.x)/2:P.x,tz=tk?(P.z+tk.z)/2:P.z;camera.position.lerp(tk?new THREE.Vector3(tx+4,9,tz+11):(CAMZ&&!DRIVE?new THREE.Vector3(tx,4.6,tz+8):new THREE.Vector3(tx,DRIVE?22:17,tz+(DRIVE?26:19))),Math.min(1,dt*(tk?3:5)));camera.lookAt(tx,CAMZ&&!DRIVE?1.5:1,tz+(CAMZ&&!DRIVE?0:1.5));
    sun.position.set(tx+30,50,tz+20);sun.target.position.set(tx,0,tz);
    // 通信
    netT+=dt;const st=`${P.x.toFixed(1)},${P.z.toFixed(1)},${P.r.toFixed(1)}`;
    if(net.ch&&((netT>(BOXF?.1:.25)&&st!==lastSent)||netT>3)){netT=0;lastSent=st;net.send('p',{id:ME.id,n:SAVE.name,ap:SAVE.ap,x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+P.r.toFixed(2),m:P.v>0?1:0,c:DRIVE?{m:DRIVE.m,c:DRIVE.c}:0,e:Math.round(SAVE.en||0)});}
    $('#act').textContent=contextAction();
  }
  // ほかの人
  for(const [id,o] of OTHERS){if(t-o.seen>12&&!o.bot){scene.remove(o.g);OTHERS.delete(id);continue;}
    if(o.bot)stepBot(o,dt);
    o.cx+=(o.x-o.cx)*Math.min(1,dt*6);o.cz+=(o.z-o.cz)*Math.min(1,dt*6);const mv=Math.hypot(o.x-o.cx,o.z-o.cz)>.05||o.m;
    o.g.position.set(o.cx,yAt(o.cx,o.cz),o.cz);let d=o.r-o.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));o.g.rotation.y+=d*Math.min(1,dt*10);animAvatar(o.g,dt,mv,1);}
  $('#people').textContent=`👥 ${OTHERS.size+1}にん`;
  // 木・花・虫
  for(const tr of TREES){if(tr.dead)continue;if(tr.shake>0){tr.shake-=dt*2;tr.crown.rotation.z=Math.sin(tr.shake*30)*.08*tr.shake;}if(tr.regrow>0){tr.regrow-=dt;if(tr.regrow<=0)tr.fruits.forEach(f=>f.visible=true);}}
  for(const f of FLOWERS){if(f.regrow>0){f.regrow-=dt;if(f.regrow<=0)f.g.visible=true;}}
  for(const b of bugs){if(b.gone>0){b.gone-=dt;if(b.gone<=0){b.g.visible=true;}continue;}b.t+=dt;
    b.vx+=Math.sin(b.t*1.3+b.c)*dt*2;b.vz+=Math.cos(b.t*1.1)*dt*2;b.vx*=.98;b.vz*=.98;const p=b.g.position;p.x+=b.vx*dt;p.z+=b.vz*dt;p.y=1.2+Math.sin(b.t*3)*.4;
    if(Math.hypot(p.x,p.z)>R-5){b.vx-=p.x*.02;b.vz-=p.z*.02;}
    b.g.children.forEach(w=>w.rotation.y=w.userData.s*Math.abs(Math.sin(b.t*14))*1.2);b.g.rotation.y=Math.atan2(b.vx,b.vz);}
  // 海の波
  water.userData.foam.material.opacity=.35+Math.sin(t*1.5)*.15;water.userData.foam.scale.setScalar(1+Math.sin(t*1.5)*.006);
  stepFish(dt);stepTrees(dt);stepBall(dt);stepLots(dt);stepTrans(dt,t);stepTown(dt,t);stepVillagers(dt,t);stepSeason(dt,t);drawMap();
  stepGfx(dt,t);draw(scene,camera);requestAnimationFrame(frame);
}

const BOTN=['タロウ','ハナ','ケンタ','ユイ','ゴロウ','サキ','ミナト','アオイ'];
function addBots(n){for(let k=0;k<n;k++){const id='bot'+k;const ap={skin:k%4,hair:k%4,hairC:(k*3)%7,shirt:(k*2+1)%10,pants:(k+4)%10,hat:k%5};const g=makeAvatar(ap,BOTN[k]);scene.add(g);const a=rnd(0,6.28),d=rnd(4,30);const x=Math.cos(a)*d,z=Math.sin(a)*d;
  OTHERS.set(id,{g,x,z,cx:x,cz:z,r:0,m:0,seen:1e12,bot:true,name:BOTN[k],tx:x,tz:z,wait:rnd(0,3)});}}
function stepBot(o,dt){
  o.wait-=dt;const d=Math.hypot(o.tx-o.x,o.tz-o.z);
  if(d<.3){o.m=0;if(o.wait<=0){const a=rnd(0,6.28),r=rnd(3,R-8);o.tx=Math.cos(a)*r;o.tz=Math.sin(a)*r;o.wait=rnd(2,6);if(Math.random()<.35)bubble(o.g,pick(PHRASES.slice(0,11)));else if(Math.random()<.3)emote(o.g,pick(['jump','wave','happy']));}}
  else if(o.wait<=0){o.m=1;o.r=Math.atan2(o.tx-o.x,o.tz-o.z);const sp=2.6;let nx=o.x+Math.sin(o.r)*sp*dt,nz=o.z+Math.cos(o.r)*sp*dt;[nx,nz]=resolve(nx,nz);if(Math.hypot(nx-o.x,nz-o.z)<sp*dt*.3){o.tx=o.x;o.tz=o.z;}o.x=nx;o.z=nz;}
}

const net={ch:null,
  available(){return !!(window.KK_CONFIG&&window.KK_CONFIG.url&&window.supabase)||/[?&]local=1/.test(location.search);},
  open(){
    const on=(ev,p)=>this.recv(ev,p);
    if(/[?&]local=1/.test(location.search)){const bc=new BroadcastChannel('island');bc.onmessage=e=>on(e.data.ev,e.data.p);this.ch={send:(ev,p)=>bc.postMessage({ev,p})};return true;}
    if(!this.available())return false;
    const cfg=window.KK_CONFIG;this.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{realtime:{params:{eventsPerSecond:12}}});
    const c=this.sb.channel('kk-island-main',{config:{broadcast:{self:false},presence:{key:ME.id}}});
    ['p','say','emo','bye','poke','lots','box','life','trade'].forEach(ev=>c.on('broadcast',{event:ev},m=>on(ev,m.payload)));
    c.on('presence',{event:'leave'},({key})=>on('bye',{id:key}));
    c.subscribe(st=>{if(st==='SUBSCRIBED'){c.track({n:SAVE.name});$('#online').textContent='🟢 オンライン';}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')$('#online').textContent='⚪ ひとりモード';});
    this.ch={send:(ev,p)=>c.send({type:'broadcast',event:ev,payload:p})};return true;
  },
  send(ev,p){try{this.ch&&this.ch.send(ev,p);}catch(e){}},
  recv(ev,p){
    if(p.id===ME.id)return;
    if(ev==='p'){let o=OTHERS.get(p.id);
      if(!o||o.apKey!==JSON.stringify(p.ap)+p.n){if(o)scene.remove(o.g);const g=makeAvatar(p.ap,p.n);scene.add(g);o={g,x:p.x,z:p.z,cx:p.x,cz:p.z,r:p.r,m:0,apKey:JSON.stringify(p.ap)+p.n};OTHERS.set(p.id,o);if(me)toast(`👋 ${p.n}さんが きました`);}
      o.x=p.x;o.z=p.z;o.r=p.r;o.m=p.m;o.name=p.n;o.car=p.c||null;if(p.e!=null)o.en=p.e;o.seen=performance.now()/1000;}
    else if(ev==='say'){const o=OTHERS.get(p.id);if(o){bubble(o.g,p.t);sfx.talk();}}
    else if(ev==='emo'){const o=OTHERS.get(p.id);if(o)emote(o.g,p.e);}
    else if(ev==='poke'){if(p.to===ME.id&&meObj){emote(meObj,'oops');bubble(meObj,'わっ！');tone(300,600,.15,'square',.05);}const o=OTHERS.get(p.id);if(o)emote(o.g,p.e);}
    else if(ev==='lots'){loadLots();}
    else if(ev==='bye'){const o=OTHERS.get(p.id);if(o&&!o.bot){scene.remove(o.g);OTHERS.delete(p.id);}}
  }
};

// ===================== パンチ・キック =====================
function hit(kind){
  if(INDOOR){if(IN.av){emote(IN.av,kind);noiseHit(.1,500,.15);}return;}
  if(!meObj||fishing||BLOCK)return;ac();
  emote(meObj,kind);net.send('emo',{id:ME.id,e:kind});
  const AX=typeof axeOn!=='undefined'&&axeOn&&kind==='punch';const pow=AX?3:(kind==='kick'?2:1);
  setTimeout(()=>{
    const fx=P.x+Math.sin(P.r)*1.6,fz=P.z+Math.cos(P.r)*1.6;
    noiseHit(.12,kind==='kick'?300:500,.25);
    // 木
    let best=null,bd=2.0;for(const t of TREES){if(t.dead)continue;const d=Math.hypot(t.x-fx,t.z-fz);if(d<bd+t.sol.r){bd=d;best=t;}}
    if(best){best.shake=1;best.hp-=pow;if(AX){tone(900,700,.06,'square',.07);noiseHit(.1,1500,.15);best.axed=1;}tone(180,120,.12,'square',.07);stars(best.x,1.2,best.z);
      if(best.hp<=0){fellTree(best);}else toast(`🌳 あと ${best.hp}かい`);return;}
    // 岩
    for(const r of ROCKS){if(Math.hypot(r.userData.x-fx,r.userData.z-fz)<2){stars(r.userData.x,1,r.userData.z);tone(900,700,.08,'square',.06);if(r.userData.cool<=0&&Math.random()<.6){addItem('stone');toast('🪨 いしが とれた');r.userData.cool=6;}return;}}
    // ボール
    if(ball&&Math.hypot(ball.x-fx,ball.z-fz)<1.8){const sp=kind==='kick'?16:9;ball.vx=Math.sin(P.r)*sp;ball.vz=Math.cos(P.r)*sp;ball.vy=kind==='kick'?6:3;tone(400,200,.1,'sine',.1);return;}
    // ほかの人(いたくない。びっくりするだけ)
    for(const [id,o] of OTHERS){if(Math.hypot(o.cx-fx,o.cz-fz)<1.6){emote(o.g,'oops');bubble(o.g,'わっ！');if(!o.bot)net.send('poke',{id:ME.id,to:id,e:'oops'});return;}}
  },kind==='kick'?170:120);
}
function stars(x,y,z){for(let k=0;k<6;k++){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.12),new THREE.MeshBasicMaterial({color:0xffe066}));s.position.set(x,y,z);s.userData={vx:rnd(-3,3),vy:rnd(2,5),vz:rnd(-3,3),l:.6};scene.add(s);FX.push(s);}}
const FX=[];
function fellTree(t){
  t.dead=1;t.fall=0;t.fallDir=P.r;sfx.rustle();tone(120,60,.5,'sawtooth',.08);
  const idx=SOLID.indexOf(t.sol);if(idx>=0)SOLID.splice(idx,1);
  setTimeout(()=>{const n=(t.kind==='pine'?4:3)+(t.axed?2:0);addItem('wood',n);toast(`🪵 もくざいを ${n}こ てにいれた`);sfx.get();
    if(t.kind!=='pine'){const left=t.fruits.filter(f=>f.visible).length;if(left){addItem(t.kind,left);}}},900);
}
function stepTrees(dt){
  for(const t of TREES){
    if(t.dead===1){t.fall+=dt*1.6;const k=Math.min(1,t.fall);t.g.rotation.z=Math.cos(t.fallDir)*k*1.5;t.g.rotation.x=Math.sin(t.fallDir)*k*-1.5;t.g.rotation.order='YXZ';
      if(t.fall>1.4){t.dead=2;t.g.visible=false;t.back=180;
        if(!t.stump){t.stump=new THREE.Mesh(new THREE.CylinderGeometry(.3*t.s,.36*t.s,.35,8),lam(0x8a5a3b));t.stump.position.set(t.x,hgt(t.x,t.z)+.17,t.z);scene.add(t.stump);}t.stump.visible=true;}}
    else if(t.dead===2){t.back-=dt;if(t.back<=0){t.dead=0;t.hp=5;t.g.visible=true;t.g.rotation.set(0,0,0);t.stump.visible=false;SOLID.push(t.sol);t.fruits.forEach(f=>f.visible=true);}}
  }
  for(let i=FX.length-1;i>=0;i--){const s=FX[i],u=s.userData;u.l-=dt;s.position.x+=u.vx*dt;s.position.y+=u.vy*dt;s.position.z+=u.vz*dt;u.vy-=12*dt;s.rotation.y+=dt*8;if(u.l<=0){scene.remove(s);FX.splice(i,1);}}
  for(const r of ROCKS)if(r.userData.cool>0)r.userData.cool-=dt;
}

let ball=null;
function buildBall(){const tex=canvasTex(128,64,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#e03131';for(let k=0;k<6;k++){c.beginPath();c.arc(k*24+8,(k%2)*30+16,9,0,7);c.fill();}});
  const m=new THREE.Mesh(new THREE.SphereGeometry(.45,18,14),new THREE.MeshLambertMaterial({map:tex}));m.castShadow=true;scene.add(m);ball={m,x:4,z:-3,y:.45,vx:0,vy:0,vz:0};}
function stepBall(dt){if(!ball)return;const b=ball;
  // 歩いて ぶつかると かるく ころがる
  const d=Math.hypot(b.x-P.x,b.z-P.z);if(d<.9&&P.v>0){b.vx+=Math.sin(P.r)*4;b.vz+=Math.cos(P.r)*4;}
  b.x+=b.vx*dt;b.z+=b.vz*dt;b.vy-=18*dt;b.y+=b.vy*dt;const g=Math.max(-.2,hgt(b.x,b.z))+.45;if(b.y<g){b.y=g;b.vy=Math.abs(b.vy)>2?-b.vy*.45:0;}
  const fr=b.y<=g+.01?.985:.997;b.vx*=fr;b.vz*=fr;
  for(const s of SOLID){const dx=b.x-s.x,dz=b.z-s.z,dd=Math.hypot(dx,dz),mm=s.r+.45;if(dd<mm&&dd>.01){const nx=dx/dd,nz=dz/dd;b.x=s.x+nx*mm;b.z=s.z+nz*mm;const vn=b.vx*nx+b.vz*nz;if(vn<0){b.vx-=1.7*vn*nx;b.vz-=1.7*vn*nz;tone(300,250,.05,'sine',.04);}}}
  const r=Math.hypot(b.x,b.z);if(r>R){b.x*=R/r;b.z*=R/r;b.vx*=-.5;b.vz*=-.5;}
  b.m.position.set(b.x,b.y,b.z);b.m.rotation.x+=b.vz*dt/.45;b.m.rotation.z-=b.vx*dt/.45;}

function placeOk(c){const f=FURN[IN.place.id];const o=occ();const px=Math.round(IN.x),pz=Math.round(IN.z);
  for(let i=0;i<c.w;i++)for(let j=0;j<c.d;j++){const k=(c.cx+i)+','+(c.cz+j);if(!f.flat&&!f.air&&(o[k]||(c.cx+i===px&&c.cz+j===pz)))return false;if(c.cz+j>=G&&Math.abs(c.cx+i)<=1&&!f.flat&&!f.air)return false;}
  if(f.air&&IN.items.some(m=>FURN[m.id].air&&m.cx===c.cx&&m.cz===c.cz))return false;
  if(f.flat&&IN.items.some(m=>FURN[m.id].flat&&!(c.cx+c.w<=m.cx||m.cx+m.w<=c.cx||c.cz+c.d<=m.cz||m.cz+m.d<=c.cz)))return false;return true;}
function updateGhost(){const c=ghostCell();IN.ghost.position.set(c.cx+(c.w-1)/2,0,c.cz+(c.d-1)/2);IN.ghost.rotation.y=-IN.place.rot*Math.PI/2;const ok=placeOk(c);IN.ghost.traverse(o=>{if(o.material)o.material.opacity=ok?.65:.25;});IN.place.ok=ok;IN.place.c=c;}
function confirmPlace(){if(!IN.place)return;updateGhost();if(!IN.place.ok){toast('ここには おけないよ');tone(200,150,.15,'square',.05);return;}
  const {id,rot,c}=IN.place;IN.room.it.push([id,c.cx,c.cz,rot]);SAVE.furn[id]--;if(!SAVE.furn[id])delete SAVE.furn[id];save();endPlace();drawRoom();saveLot(IN.lot);sfx.get();toast(`${FURN[id].e} ${FURN[id].n}を おいた`);}

const md=d=>(d.getMonth()+1)*100+d.getDate();
function eventOf(d){const x=md(d);return EVENTS.find(e=>x>=e.f[0]*100+e.f[1]&&x<=e.t[0]*100+e.t[1])||null;}
function nextEvents(d,n){const x=md(d);const y=d.getFullYear();return EVENTS.map(e=>{let yy=y;if(e.f[0]*100+e.f[1]<=x)yy++;const dt=new Date(yy,e.f[0]-1,e.f[1]);return{e,dt};}).filter(o=>!(eventOf(d)&&o.e===eventOf(d))).sort((a,b)=>a.dt-b.dt).slice(0,n);}

function stepSeason(dt,t){

      if(k==='fly'){y=1+Math.abs(Math.sin(t*.5+i))*2.5;x+=Math.sin(t+i)*dt*.6;z+=Math.cos(t*.8+i)*dt*.6;}
      else{y-=dt*(k==='snow'?1.6:1.1);x+=Math.sin(t*.7+i)*dt*(k==='snow'?.4:1.2)+dt*.5;z+=Math.cos(t*.5+i*1.3)*dt*.4;}

      const r=await srv('kk_island_offer',{p_lot:+sel.key,p_owner:OWNER,p_code:code});if(!r||!r.ok){toast('じゅんびが できなかった（SQLを いれてね）');return;}off.code=code;}
    else if(!tradeTake(sel.kind,sel.key,n)){toast('もう もっていないよ');return;}
    TRD.out={...off,t:performance.now()/1000};net.send('trade',off);$('#panel').classList.remove('show');sfx.pop();toast(`🤝 ${o.name||'だれか'}さんに もちかけたよ（へんじを まってね）`);bubble(meObj,`${sel.e} ${price}コインで どう？`);};}
function tradeCancelOut(why){const o=TRD.out;if(!o)return;if(o.kind!=='lot')tradeGive(o.kind,o.key,o.n);TRD.out=null;if(why)toast(why);}
function tradeRecv(p){if(!p||p.to!==ME.id&&p.op==='offer')return;
  if(p.op==='offer'){if(p.to!==ME.id)return;if(TRD.inc){net.send('trade',{op:'no',tid:p.tid,id:ME.id,to:p.id,why:'busy'});return;}
    TRD.inc={...p,t:performance.now()/1000};sfx.talk();
    shopPanel('🤝 とりひきの もうしこみ',`<p style="font-size:18px"><b>${esc(p.from)}</b>さんが<br>${p.e} <b>${esc(p.nm)}</b>${p.n>1?` ×${p.n}`:''} を<br><b style="font-size:22px">${(+p.price).toLocaleString()}コイン</b>で うりたいって。</p><p class="sm">いまの コイン：${SAVE.coins.toLocaleString()}</p><button class="btn" id="tryes">かう</button><button class="btn" id="trno" style="background:#ced4da;color:#333">ことわる</button>`);
    $('#tryes').onclick=()=>tradeAccept();$('#trno').onclick=()=>{tradeDecline();$('#panel').classList.remove('show');};
    $('#pclose').onclick=()=>{tradeDecline();$('#panel').classList.remove('show');};return;}
  if(p.to!==ME.id)return;
  if(p.op==='no'){if(TRD.out&&TRD.out.tid===p.tid){tradeCancelOut(p.why==='busy'?'あいては いま ほかの とりひき ちゅう':p.why==='coin'?'あいての コインが たりなかった':'ことわられちゃった…');}return;}
  if(p.op==='paid'){const o=TRD.out;if(!o||o.tid!==p.tid){if(p.price>0&&String(p.tid).startsWith(ME.id+'-')&&!TRD.done[p.tid]){TRD.done[p.tid]=1;SAVE.coins+=+p.price;save();updateHud();toast(`🤝 おくれて ${p.price}コイン とどいた`);}return;}TRD.done[p.tid]=1;
    TRD.out=null;SAVE.coins+=o.price;if(o.kind==='lot'){delete SAVE.lots[o.key];if(SAVE.biz)delete SAVE.biz[o.key];loadLots();}
    save();updateHud();sfx.big();bigCard('🤝',`${o.nm}が うれた！`,`＋${o.price.toLocaleString()}コイン`);speak(`${o.price}コインで うれました`);return;}}
async function tradeAccept(){const p=TRD.inc;if(!p)return;if(performance.now()/1000-p.t>50){toast('じかんぎれ…');TRD.inc=null;$('#panel').classList.remove('show');return;}
  if(SAVE.coins<p.price){net.send('trade',{op:'no',tid:p.tid,id:ME.id,to:p.id,why:'coin'});TRD.inc=null;toast('コインが たりない');$('#panel').classList.remove('show');return;}
  if(p.kind==='lot'){const r=await srv('kk_island_take',{p_lot:+p.key,p_code:p.code,p_owner:OWNER,p_name:SAVE.name});
    if(!r||!r.ok){toast(r&&r.why==='max'?'その しゅるいの とちは もう もてないよ':'かえなかった（じかんぎれ かも）');net.send('trade',{op:'no',tid:p.tid,id:ME.id,to:p.id});TRD.inc=null;$('#panel').classList.remove('show');return;}
    await loadLots();const L=LOTI[+p.key];if(L){renderLot(L.i);if(LOTDATA[L.i])SAVE.lots[L.i]=LOTDATA[L.i].data;}net.send('lots',{id:ME.id});}
  else tradeGive(p.kind,p.key,p.n);
  SAVE.coins-=p.price;save();updateHud();net.send('trade',{op:'paid',tid:p.tid,id:ME.id,to:p.id,price:p.price});TRD.inc=null;
  sfx.big();bigCard(p.e,`${p.nm}を かった！`,`－${(+p.price).toLocaleString()}コイン`);$('#panel').classList.remove('show');say(`${p.nm} かったよ！ ありがとう`);}
function tradeDecline(){const p=TRD.inc;if(!p)return;net.send('trade',{op:'no',tid:p.tid,id:ME.id,to:p.id});TRD.inc=null;}
{const _r=net.recv.bind(net);net.recv=function(ev,p){if(ev==='trade'){if(p&&p.id!==ME.id)tradeRecv(p);return;}return _r(ev,p);};}
