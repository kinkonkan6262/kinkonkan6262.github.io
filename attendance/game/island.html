else{
// ===== きんこんかん島 =====

// ---- 音 ----
let AC=null,soundOn=true;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f1,f2,d,type='sine',v=.07,delay=0){if(!soundOn)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}catch(e){}}
function noiseHit(d,f,v){if(!soundOn)return;try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();bp.type='bandpass';bp.frequency.value=f;s.buffer=b;g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();}catch(e){}}
const sfx={step(){noiseHit(.05,900,.05);},pop(){tone(600,1200,.08,'sine',.08);},get(){[784,988,1175].forEach((f,k)=>tone(f,f,.12,'triangle',.07,k*.07));},
  splash(){noiseHit(.3,700,.25);},rustle(){noiseHit(.4,2500,.12);},coin(){tone(1300,1300,.06,'square',.04);tone(1750,1750,.12,'square',.04,.06);},
  big(){[523,659,784,1047,1319].forEach((f,k)=>tone(f,f,.18,'triangle',.08,k*.09));},talk(){for(let k=0;k<4;k++)tone(rnd(400,800),rnd(400,800),.05,'square',.025,k*.06);}};
function speak(t){if(!soundOn)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
// ---- 見た目の色 ----
const SKIN=['#f6d2b4','#e8b48c','#c98d62','#8d5a3b'];
const HAIRC=['#2b2320','#6b3e1f','#d9a441','#c0392b','#e57fb0','#3b6fd8','#eeeeee'];
const CLOTH=['#ff6b6b','#4dabf7','#51cf66','#ffd43b','#b197fc','#ff922b','#f1f3f5','#343a40','#20c997','#f783ac'];
const HATS=['なし','むぎわら','キャップ','ニット','はな'];
const HAIRS=['ショート','ボブ','ツインテール','ぼうず'];
// ---- テクスチャ ----
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function lam(c,o={}){return new THREE.MeshLambertMaterial({color:c,...o});}
// ---- キャラクター(オリジナル) ----
function makeAvatar(ap,name){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const skin=lam(SKIN[ap.skin%4]),hairM=lam(HAIRC[ap.hairC%HAIRC.length]),shirt=lam(CLOTH[ap.shirt%CLOTH.length]),pants=lam(CLOTH[ap.pants%CLOTH.length]),shoe=lam(0x5a3a28),black=new THREE.MeshBasicMaterial({color:0x1b1b1b}),white=new THREE.MeshBasicMaterial({color:0xffffff}),blush=new THREE.MeshBasicMaterial({color:0xff9aa8,transparent:true,opacity:.7});
  const mk=(geo,m,x,y,z,parent=body)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;};
  // 足
  const legs=[];for(const s of [-1,1]){const lg=new THREE.Group();lg.position.set(s*.16,.55,0);body.add(lg);mk(new THREE.CylinderGeometry(.1,.11,.45,10),pants,0,-.22,0,lg);mk(new THREE.SphereGeometry(.13,10,8),shoe,0,-.47,.05,lg).scale.set(1,.6,1.4);legs.push(lg);}
  // 体
  mk(new THREE.CylinderGeometry(.27,.33,.6,14),shirt,0,.85,0);
  mk(new THREE.SphereGeometry(.27,14,10,0,Math.PI*2,0,Math.PI/2),shirt,0,1.14,0).scale.y=.45;
  // うで
  const arms=[];for(const s of [-1,1]){const am=new THREE.Group();am.position.set(s*.33,1.1,0);body.add(am);mk(new THREE.CylinderGeometry(.075,.07,.45,8),shirt,0,-.2,0,am);mk(new THREE.SphereGeometry(.085,8,6),skin,0,-.45,0,am);am.rotation.z=s*.12;arms.push(am);}
  // 頭
  const head=new THREE.Group();head.position.y=1.62;body.add(head);
  mk(new THREE.SphereGeometry(.48,20,16),skin,0,0,0,head);
  for(const s of [-1,1]){mk(new THREE.SphereGeometry(.065,10,8),black,s*.17,-.02,.44,head).scale.set(1,1.35,.5);mk(new THREE.SphereGeometry(.022,6,4),white,s*.15,.03,.475,head);mk(new THREE.CircleGeometry(.07,12),blush,s*.27,-.13,.405,head).lookAt(s*2,-.5,5);}
  mk(new THREE.SphereGeometry(.035,8,6),lam(0xd98a6a),0,-.09,.47,head);
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.05,.012,6,12,Math.PI),black);mouth.position.set(0,-.17,.45);mouth.rotation.z=Math.PI;head.add(mouth);
  // 髪
  const hs=ap.hair%HAIRS.length;
  if(hs!==3){const cap=mk(new THREE.SphereGeometry(.51,20,14,0,Math.PI*2,0,Math.PI*.5),hairM,0,.04,-.02,head);cap.rotation.x=-.32;
    if(hs===0){mk(new THREE.BoxGeometry(.7,.16,.25),hairM,0,.26,.33,head).rotation.x=.5;}
    if(hs===1){mk(new THREE.SphereGeometry(.53,18,12,Math.PI/2+1.0,Math.PI*2-2.0,Math.PI*.3,Math.PI*.42),hairM,0,-.04,-.03,head);mk(new THREE.BoxGeometry(.75,.14,.2),hairM,0,.24,.35,head).rotation.x=.4;}
    if(hs===2){for(const s of [-1,1]){mk(new THREE.SphereGeometry(.17,10,8),hairM,s*.5,.0,-.12,head).scale.set(.8,1.4,.8);}mk(new THREE.BoxGeometry(.7,.15,.22),hairM,0,.25,.34,head).rotation.x=.45;}
  }else{mk(new THREE.SphereGeometry(.49,18,12,0,Math.PI*2,0,Math.PI*.5),hairM,0,.01,0,head).material=lam(new THREE.Color(HAIRC[ap.hairC%HAIRC.length]).lerp(new THREE.Color(SKIN[ap.skin%4]),.5));}
  // 帽子
  const ht=ap.hat%HATS.length;
  if(ht===1){const st=lam(0xf2d27a);mk(new THREE.CylinderGeometry(.85,.85,.04,24),st,0,.32,0,head);mk(new THREE.CylinderGeometry(.36,.42,.3,18),st,0,.45,0,head);mk(new THREE.CylinderGeometry(.43,.43,.08,18),lam(0xe03131),0,.36,0,head);}
  if(ht===2){const cp=lam(CLOTH[(ap.shirt+3)%CLOTH.length]);mk(new THREE.SphereGeometry(.5,18,10,0,Math.PI*2,0,Math.PI*.5),cp,0,.12,0,head);mk(new THREE.BoxGeometry(.5,.04,.35),cp,0,.17,.45,head);}
  if(ht===3){const kn=lam(CLOTH[(ap.shirt+5)%CLOTH.length]);mk(new THREE.SphereGeometry(.52,18,12,0,Math.PI*2,0,Math.PI*.5),kn,0,.08,0,head);mk(new THREE.SphereGeometry(.12,10,8),lam(0xffffff),0,.62,0,head);}
  if(ht===4){for(let k=0;k<5;k++){const a=k/5*Math.PI*2;mk(new THREE.SphereGeometry(.09,8,6),lam(0xff8fab),.28+Math.cos(a)*.09,.33+Math.sin(a)*.09,.15,head);}mk(new THREE.SphereGeometry(.07,8,6),lam(0xffd43b),.28,.33,.18,head);}
  // かげ
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.45,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.02;g.add(sh);

  if(name!=null)setTag(g,name);

  return g;
}
function setTag(g,name){
  if(g.userData&&g.userData.tag)g.remove(g.userData.tag);
  const t=canvasTex(256,64,(c,w,h)=>{c.fillStyle='rgba(255,255,255,.88)';c.beginPath();c.roundRect?c.roundRect(10,8,w-20,h-16,24):c.rect(10,8,w-20,h-16);c.fill();c.fillStyle='#3a3a3a';c.font='bold 32px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(name,w/2,h/2+1);});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));sp.scale.set(1.8,.45,1);sp.position.y=2.75;sp.renderOrder=5;g.add(sp);g.userData=g.userData||{};g.userData.tag=sp;
}
function bubble(g,text){
  const ud=g.userData;if(ud.bub)g.remove(ud.bub);
  const lines=[];let s=text;while(s.length>9){lines.push(s.slice(0,9));s=s.slice(9);}lines.push(s);
  const H=40+lines.length*44;
  const t=canvasTex(320,H+30,(c,w,h)=>{c.fillStyle='#fff';c.strokeStyle='#e0c88a';c.lineWidth=6;c.beginPath();c.roundRect?c.roundRect(6,6,w-12,H-6,30):c.rect(6,6,w-12,H-6);c.fill();c.stroke();c.beginPath();c.moveTo(w/2-16,H-2);c.lineTo(w/2,h-4);c.lineTo(w/2+16,H-2);c.fill();
    c.fillStyle='#4a3a20';c.font='bold 38px sans-serif';c.textAlign='center';c.textBaseline='middle';lines.forEach((l,i)=>c.fillText(l,w/2,30+i*44+12));});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));const sc=2.6;sp.scale.set(sc,sc*(H+30)/320,1);sp.position.y=3.2+sp.scale.y/2;sp.renderOrder=6;g.add(sp);ud.bub=sp;ud.bubT=5;
}
function animAvatar(g,dt,moving,speed=1){
  const u=g.userData;if(!u.body)return;
  if(moving){u.walk+=dt*10*speed;}else u.walk*=.8;
  const s=Math.sin(u.walk)*(moving?.7:0);
  u.legs[0].rotation.x=s;u.legs[1].rotation.x=-s;u.arms[0].rotation.x=-s*.8;u.arms[1].rotation.x=s*.8;
  u.body.position.y=moving?Math.abs(Math.cos(u.walk))*.08:0;
  u.head.rotation.z=moving?Math.sin(u.walk*.5)*.04:Math.sin(performance.now()/900)*.02;
  if(u.emo){u.emoT-=dt;const k=1-u.emoT;
    if(u.emo==='jump')u.body.position.y=Math.max(0,Math.sin(Math.min(1,k*1.5)*Math.PI))*.9;
    if(u.emo==='wave'){u.arms[1].rotation.z=2.6+Math.sin(k*20)*.4;u.arms[1].rotation.x=0;}
    if(u.emo==='happy'){u.body.rotation.y=k*Math.PI*2;}
    if(u.emoT<=0){u.emo=null;u.arms[1].rotation.z=.12;u.body.rotation.y=0;}}
  if(u.bub){u.bubT-=dt;u.bub.material.opacity=Math.min(1,u.bubT);if(u.bubT<=0){g.remove(u.bub);u.bub=null;}}
}
function emote(g,e){g.userData.emo=e;g.userData.emoT=1;}
// ---- 世界 ----
const SOLID=[]; // {x,z,r}
const TREES=[],FLOWERS=[],ROCKS=[];
let water,waterBase,bugs=[],shopPos=new THREE.Vector3(0,0,-16),boardPos=new THREE.Vector3(6,0,-6);
function hgt(x,z){const r=Math.hypot(x,z);let h=Math.sin(x*.07)*Math.cos(z*.06)*.6+Math.sin(x*.13+z*.11)*.3;
  if(r<20)h*=r/20*.6; // 広場は平ら
  if(r>R-4)h=h*Math.max(0,(R+2-r)/6);
  if(r>R)h-= (r-R)*.35;
  return h;}
function initScene(){
  const cv=$('#gl');
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(40,1,.5,600);
  hemi=new THREE.HemisphereLight(0xeaf4ff,0x7da15a,.7);scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff1d6,1.0);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=-30;sc.right=30;sc.top=30;sc.bottom=-30;sc.far=200;sun.shadow.bias=-.0006;scene.add(sun);scene.add(sun.target);

  const skyDay=new THREE.Color(0x8fd3ff),skyNight=new THREE.Color(0x101a3a),skyEve=new THREE.Color(0xffb27a);
  const eve=(h>16.5&&h<19)||(h>5&&h<7)?1-Math.abs(((h>12?17.75:6)-h))/1.25:0;
  const sky=skyNight.clone().lerp(skyDay,day).lerp(skyEve,Math.max(0,eve)*.6);
  scene.background=sky;scene.fog.color.copy(sky);
  sun.intensity=.25+day*.85;hemi.intensity=.3+day*.5;sun.color.set(eve>0?0xffc890:0xfff1d6);
  const night=day<.25;scene.userData.lampM.emissive.set(night?0xffd27a:0x000000);(scene.userData.wins||[]).forEach(m=>m.emissive.set(night?0xffd27a:0x000000));

const PHRASES=['こんにちは！','いっしょに あそぼう！','つれたよ！','すごいね！','ありがとう！','またね〜','おなか すいた','ここに きて！','🎣','🦋','🍎','❤️','😆','👍'];
function say(t){bubble(meObj,t);sfx.talk();net.send('say',{id:ME.id,t});}
$('#chat').onclick=()=>{$('#phr').classList.toggle('show');};
$('#phr').innerHTML=PHRASES.map(p=>`<button>${p}</button>`).join('')+`<button data-e="wave">👋 てをふる</button><button data-e="happy">💃 よろこぶ</button>`;
$('#phr').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#phr').classList.remove('show');if(b.dataset.e){emote(meObj,b.dataset.e);net.send('emo',{id:ME.id,e:b.dataset.e});return;}say(b.textContent);};
// ---- HUD ----
function updateHud(){
  const cnt=Object.values(SAVE.bag).reduce((a,b)=>a+b,0);$('#coins').textContent=`🪙 ${SAVE.coins.toLocaleString()}`;$('#bagn').textContent=cnt;
}
$('#bagb').onclick=()=>{const rows=Object.keys(SAVE.bag).map(k=>`<li>${ITEMS[k].e} ${ITEMS[k].n} ×${SAVE.bag[k]}<small>${ITEMS[k].p}コイン</small></li>`).join('')||'<li>からっぽ</li>';
  const all=Object.keys(ITEMS).filter(k=>ITEMS[k].f||ITEMS[k].b);const got=all.filter(k=>SAVE.book[k]).length;
  $('#panel').innerHTML=`<h3>🎒 もちもの</h3><ul>${rows}</ul><p class="sm">おみせの ちかくで「うる」と コインに なるよ</p><h3>📖 ずかん ${got}/${all.length}</h3><div class="book">${all.map(k=>`<span class="${SAVE.book[k]?'got':''}">${SAVE.book[k]?ITEMS[k].e:'？'}<small>${SAVE.book[k]?ITEMS[k].n:'？？？'}</small></span>`).join('')}</div><button class="btn" onclick="this.parentNode.classList.remove('show')">とじる</button>`;$('#panel').classList.add('show');};
// ---- ループ ----
let netT=0,lastSent='';
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=performance.now()/1000;
  if(me){
    // 移動
    let ix=JOY.x+((K.ArrowRight||K.KeyD)?1:0)-((K.ArrowLeft||K.KeyA)?1:0),iz=JOY.y+((K.ArrowDown||K.KeyS)?1:0)-((K.ArrowUp||K.KeyW)?1:0);
    const m=Math.min(1,Math.hypot(ix,iz));
    if(m>.1&&!fishing){P.r=Math.atan2(ix,iz);const sp=(m>.75?6.2:3)*m;[P.x,P.z]=resolve(P.x+Math.sin(P.r)*sp*dt,P.z+Math.cos(P.r)*sp*dt);P.v=sp;}else P.v=0;
    meObj.position.set(P.x,Math.max(-.2,hgt(P.x,P.z)),P.z);
    let dr=P.r-meObj.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));meObj.rotation.y+=dr*Math.min(1,dt*12);
    animAvatar(meObj,dt,P.v>0,P.v/4);
    if(P.v>0&&Math.floor(meObj.userData.walk/Math.PI)!==meObj.userData.lastStep){meObj.userData.lastStep=Math.floor(meObj.userData.walk/Math.PI);sfx.step();}
    // カメラ
    const tx=P.x,tz=P.z;camera.position.lerp(new THREE.Vector3(tx,17,tz+19),Math.min(1,dt*5));camera.lookAt(tx,1,tz+1.5);
    sun.position.set(tx+30,50,tz+20);sun.target.position.set(tx,0,tz);
    // 通信
    netT+=dt;const st=`${P.x.toFixed(1)},${P.z.toFixed(1)},${P.r.toFixed(1)}`;
    if(net.ch&&((netT>.25&&st!==lastSent)||netT>3)){netT=0;lastSent=st;net.send('p',{id:ME.id,n:SAVE.name,ap:SAVE.ap,x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+P.r.toFixed(2),m:P.v>0?1:0});}
    $('#act').textContent=contextAction();
  }
  // ほかの人
  for(const [id,o] of OTHERS){if(t-o.seen>12&&!o.bot){scene.remove(o.g);OTHERS.delete(id);continue;}
    if(o.bot)stepBot(o,dt);
    o.cx+=(o.x-o.cx)*Math.min(1,dt*6);o.cz+=(o.z-o.cz)*Math.min(1,dt*6);const mv=Math.hypot(o.x-o.cx,o.z-o.cz)>.05||o.m;
    o.g.position.set(o.cx,Math.max(-.2,hgt(o.cx,o.cz)),o.cz);let d=o.r-o.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));o.g.rotation.y+=d*Math.min(1,dt*10);animAvatar(o.g,dt,mv,1);}
  $('#people').textContent=`👥 ${OTHERS.size+1}にん`;
  // 木・花・虫
  for(const tr of TREES){if(tr.shake>0){tr.shake-=dt*2;tr.crown.rotation.z=Math.sin(tr.shake*30)*.08*tr.shake;}if(tr.regrow>0){tr.regrow-=dt;if(tr.regrow<=0)tr.fruits.forEach(f=>f.visible=true);}}
  for(const f of FLOWERS){if(f.regrow>0){f.regrow-=dt;if(f.regrow<=0)f.g.visible=true;}}
  for(const b of bugs){if(b.gone>0){b.gone-=dt;if(b.gone<=0){b.g.visible=true;}continue;}b.t+=dt;
    b.vx+=Math.sin(b.t*1.3+b.c)*dt*2;b.vz+=Math.cos(b.t*1.1)*dt*2;b.vx*=.98;b.vz*=.98;const p=b.g.position;p.x+=b.vx*dt;p.z+=b.vz*dt;p.y=1.2+Math.sin(b.t*3)*.4;
    if(Math.hypot(p.x,p.z)>R-5){b.vx-=p.x*.02;b.vz-=p.z*.02;}
    b.g.children.forEach(w=>w.rotation.y=w.userData.s*Math.abs(Math.sin(b.t*14))*1.2);b.g.rotation.y=Math.atan2(b.vx,b.vz);}
  // 海の波
  const pa=waterBase.attributes.position,y0=waterBase.userData.y0;for(let i=0;i<pa.count;i++){const x=y0[i*3],z=y0[i*3+2];pa.array[i*3+1]=Math.sin(x*.15+t*1.2)*.18+Math.cos(z*.12+t)*.15;}pa.needsUpdate=true;
  water.userData.foam.material.opacity=.35+Math.sin(t*1.5)*.15;water.userData.foam.scale.setScalar(1+Math.sin(t*1.5)*.006);
  stepFish(dt);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
// ---- にぎやか(コンピュータの住人) ----
const BOTN=['タロウ','ハナ','ケンタ','ユイ','ゴロウ','サキ','ミナト','アオイ'];
function addBots(n){for(let k=0;k<n;k++){const id='bot'+k;const ap={skin:k%4,hair:k%4,hairC:(k*3)%7,shirt:(k*2+1)%10,pants:(k+4)%10,hat:k%5};const g=makeAvatar(ap,BOTN[k]);scene.add(g);const a=rnd(0,6.28),d=rnd(4,30);const x=Math.cos(a)*d,z=Math.sin(a)*d;
  OTHERS.set(id,{g,x,z,cx:x,cz:z,r:0,m:0,seen:1e12,bot:true,tx:x,tz:z,wait:rnd(0,3)});}}
function stepBot(o,dt){
  o.wait-=dt;const d=Math.hypot(o.tx-o.x,o.tz-o.z);
  if(d<.3){o.m=0;if(o.wait<=0){const a=rnd(0,6.28),r=rnd(3,R-8);o.tx=Math.cos(a)*r;o.tz=Math.sin(a)*r;o.wait=rnd(2,6);if(Math.random()<.35)bubble(o.g,pick(PHRASES.slice(0,11)));else if(Math.random()<.3)emote(o.g,pick(['jump','wave','happy']));}}
  else if(o.wait<=0){o.m=1;o.r=Math.atan2(o.tx-o.x,o.tz-o.z);const sp=2.6;let nx=o.x+Math.sin(o.r)*sp*dt,nz=o.z+Math.cos(o.r)*sp*dt;[nx,nz]=resolve(nx,nz);if(Math.hypot(nx-o.x,nz-o.z)<sp*dt*.3){o.tx=o.x;o.tz=o.z;}o.x=nx;o.z=nz;}
}
// ---- 通信(みんなの島) ----
const net={ch:null,
  available(){return !!(window.KK_CONFIG&&window.KK_CONFIG.url&&window.supabase)||/[?&]local=1/.test(location.search);},
  open(){
    const on=(ev,p)=>this.recv(ev,p);
    if(/[?&]local=1/.test(location.search)){const bc=new BroadcastChannel('island');bc.onmessage=e=>on(e.data.ev,e.data.p);this.ch={send:(ev,p)=>bc.postMessage({ev,p})};return true;}
    if(!this.available())return false;
    const cfg=window.KK_CONFIG;this.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{realtime:{params:{eventsPerSecond:12}}});
    const c=this.sb.channel('kk-island-main',{config:{broadcast:{self:false},presence:{key:ME.id}}});
    ['p','say','emo','bye'].forEach(ev=>c.on('broadcast',{event:ev},m=>on(ev,m.payload)));
    c.on('presence',{event:'leave'},({key})=>on('bye',{id:key}));
    c.subscribe(st=>{if(st==='SUBSCRIBED'){c.track({n:SAVE.name});$('#online').textContent='🟢 オンライン';}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')$('#online').textContent='⚪ ひとりモード';});
    this.ch={send:(ev,p)=>c.send({type:'broadcast',event:ev,payload:p})};return true;
  },
  send(ev,p){try{this.ch&&this.ch.send(ev,p);}catch(e){}},
  recv(ev,p){
    if(p.id===ME.id)return;
    if(ev==='p'){let o=OTHERS.get(p.id);
      if(!o||o.apKey!==JSON.stringify(p.ap)+p.n){if(o)scene.remove(o.g);const g=makeAvatar(p.ap,p.n);scene.add(g);o={g,x:p.x,z:p.z,cx:p.x,cz:p.z,r:p.r,m:0,apKey:JSON.stringify(p.ap)+p.n};OTHERS.set(p.id,o);if(me)toast(`👋 ${p.n}さんが きました`);}
      o.x=p.x;o.z=p.z;o.r=p.r;o.m=p.m;o.seen=performance.now()/1000;}
    else if(ev==='say'){const o=OTHERS.get(p.id);if(o){bubble(o.g,p.t);sfx.talk();}}
    else if(ev==='emo'){const o=OTHERS.get(p.id);if(o)emote(o.g,p.e);}
    else if(ev==='bye'){const o=OTHERS.get(p.id);if(o&&!o.bot){scene.remove(o.g);OTHERS.delete(p.id);}}
  }
};
window.addEventListener('beforeunload',()=>net.send('bye',{id:ME.id}));
// ---- キャラクターづくり ----
let preview=null,pvScene,pvCam,pvR;
function editorShow(){
  $('#nm').value=SAVE.name;
  const opts=[['skin','はだ',SKIN.map((c,i)=>`<i style="background:${c}"></i>`)],['hair','かみがた',HAIRS],['hairC','かみの いろ',HAIRC.map(c=>`<i style="background:${c}"></i>`)],['shirt','ふく',CLOTH.map(c=>`<i style="background:${c}"></i>`)],['pants','ズボン',CLOTH.map(c=>`<i style="background:${c}"></i>`)],['hat','ぼうし',HATS]];
  $('#opts').innerHTML=opts.map(([k,l,a])=>`<div class="opt"><span>${l}</span><div>${a.map((x,i)=>`<button data-k="${k}" data-v="${i}" class="${SAVE.ap[k]===i?'sel':''}">${x}</button>`).join('')}</div></div>`).join('');
  refreshPreview();
}
$('#opts').onclick=e=>{const b=e.target.closest('button');if(!b)return;SAVE.ap[b.dataset.k]=+b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));tone(800,1000,.05,'triangle',.05);refreshPreview();};
function refreshPreview(){
  if(!pvR){pvR=new THREE.WebGLRenderer({canvas:$('#pv'),antialias:true,alpha:true});pvR.outputEncoding=THREE.sRGBEncoding;pvScene=new THREE.Scene();pvScene.add(new THREE.HemisphereLight(0xffffff,0x88aa77,.9));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(2,4,5);pvScene.add(dl);pvCam=new THREE.PerspectiveCamera(30,1,.1,50);pvCam.position.set(0,1.6,6.5);pvCam.lookAt(0,1.3,0);
    const r=$('#pv').getBoundingClientRect();pvR.setSize(r.width,r.height,false);pvR.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    (function spin(){if(preview&&$('#edit').classList.contains('show')){preview.rotation.y+=.012;animAvatar(preview,.016,false);pvR.render(pvScene,pvCam);}requestAnimationFrame(spin);})();}
  if(preview)pvScene.remove(preview);preview=makeAvatar(SAVE.ap,null);pvScene.add(preview);
}
$('#start').onclick=()=>{
  SAVE.name=($('#nm').value.trim()||'あなた').slice(0,8);save();try{localStorage.setItem('kk_name',SAVE.name);}catch(e){}
  ac();$('#edit').classList.remove('show');
  if(meObj)scene.remove(meObj);meObj=makeAvatar(SAVE.ap,SAVE.name);scene.add(meObj);me=true;
  camera.position.set(P.x,17,P.z+19);
  if(!net.ch){const ok=net.open();$('#online').textContent=ok?'🟡 せつぞく ちゅう…':'⚪ ひとりモード';if(!ok||/[?&]bots=1/.test(location.search))addBots(8);}
  updateHud();speak(`ようこそ、きんこんかん島へ`);bubble(meObj,'ようこそ！');
};
$('#editb').onclick=()=>{editorShow();$('#edit').classList.add('show');};
$('#act').addEventListener('pointerdown',e=>{e.preventDefault();action();});
$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔈';};
function resize(){const w=window.innerWidth,h=window.innerHeight;$('#app').style.height=h+'px';renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?48:36;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
initScene();resize();dayNight();setInterval(dayNight,30000);editorShow();requestAnimationFrame(frame);
window.ISL={P,OTHERS,SAVE,action,contextAction};

}
