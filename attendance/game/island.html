<script>

else{
// ===== きんこんかん島 =====

const RT=R-16; // せんろの 半径
const SI={x:-Math.SQRT1_2*(R+110),z:Math.SQRT1_2*(R+110),r:30}; // はなれじま
const STA=[{a:3*Math.PI/4+.1,n:'みなと まえ'},{a:-3*Math.PI/4,n:'もりの おく'},{a:-Math.PI/4,n:'はなばたけ'},{a:Math.PI/4+.35,n:'とちの まち'}];
const HARB={a:3*Math.PI/4};
function smooth(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}
function rayDist(x,z,a){const dx=Math.cos(a),dz=Math.sin(a);const t=x*dx+z*dz;if(t<10||t>RT)return 99;return Math.abs(-x*dz+z*dx);}
const BANK={x:-19,z:-19};
function nearInfra(x,z,m=0){const r=Math.hypot(x,z);if(x>-66-m&&x<66+m&&z>-172-m&&z<-50+m)return true;if(z>-92&&z<-18&&Math.abs(x)<6+m)return true;if(Math.hypot(x-BANK.x,z-BANK.z)<10+m)return true;if(Math.abs(r-RT)<6+m)return true;for(const st of STA)if(rayDist(x,z,st.a)<2.6+m)return true;
  const hx=Math.cos(HARB.a)*(R-6),hz=Math.sin(HARB.a)*(R-6);if(Math.hypot(x-hx,z-hz)<16+m)return true;return false;}
// 土地(20区画): 東がわ
const LOTS=[];for(let r=0;r<5;r++)for(let c=0;c<4;c++)LOTS.push({i:LOTS.length,cx:44+c*14,cz:-30+r*14});
const LOTW=12;const inLotArea=(x,z)=>x>36&&x<104&&z<-22+5*14-6&&z>-38;

// ---- 音 ----
let AC=null,soundOn=true;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f1,f2,d,type='sine',v=.07,delay=0){if(!soundOn)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}catch(e){}}
function noiseHit(d,f,v){if(!soundOn)return;try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();bp.type='bandpass';bp.frequency.value=f;s.buffer=b;g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();}catch(e){}}

function placeOk(c){const f=FURN[IN.place.id];const o=occ();const px=Math.round(IN.x),pz=Math.round(IN.z);
  for(let i=0;i<c.w;i++)for(let j=0;j<c.d;j++){const k=(c.cx+i)+','+(c.cz+j);if(!f.flat&&!f.air&&(o[k]||(c.cx+i===px&&c.cz+j===pz)))return false;if(c.cz+j>=G&&Math.abs(c.cx+i)<=1&&!f.flat&&!f.air)return false;}
  if(f.air&&IN.items.some(m=>FURN[m.id].air&&m.cx===c.cx&&m.cz===c.cz))return false;
  if(f.flat&&IN.items.some(m=>FURN[m.id].flat&&!(c.cx+c.w<=m.cx||m.cx+m.w<=c.cx||c.cz+c.d<=m.cz||m.cz+m.d<=c.cz)))return false;return true;}
function updateGhost(){const c=ghostCell();IN.ghost.position.set(c.cx+(c.w-1)/2,0,c.cz+(c.d-1)/2);IN.ghost.rotation.y=-IN.place.rot*Math.PI/2;const ok=placeOk(c);IN.ghost.traverse(o=>{if(o.material)o.material.opacity=ok?.65:.25;});IN.place.ok=ok;IN.place.c=c;}
function confirmPlace(){if(!IN.place)return;updateGhost();if(!IN.place.ok){toast('ここには おけないよ');tone(200,150,.15,'square',.05);return;}

  const n=420,arr=new Float32Array(n*3),ph=new Float32Array(n);for(let i=0;i<n;i++){let x,z;do{x=(Math.random()-.5)*220;z=(Math.random()-.5)*220;}while(false);arr[i*3]=x;arr[i*3+1]=-.05;arr[i*3+2]=z;ph[i]=Math.random()*6.28;}

    vertexShader:'attribute float ph;uniform float t;varying float vA;void main(){vA=pow(max(0.,sin(t*2.5+ph*9.)),6.);vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=vA*240./-mv.z;gl_Position=projectionMatrix*mv;}',

}

// くさむら(ふさふさ)
let GRASS=null;
function addGrass(){const n=14000,geo=new THREE.ConeGeometry(.07,.55,3);geo.translate(0,.22,0);
  const m=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:TOONG});
  GRASS=new THREE.InstancedMesh(geo,m,n);const M=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),ps=new THREE.Vector3(),col=new THREE.Color();let k=0;const r=seeded(77);
  for(let i=0;i<n*3&&k<n;i++){const a=r()*6.28,d=Math.sqrt(r())*(R-4),x=Math.cos(a)*d,z=Math.sin(a)*d;if(nearInfra(x,z,-3))continue;
    if(d<11&&d>8)continue;if(Math.abs(x)<1.8&&z<-1&&z>-14)continue;if(Math.abs(z+2)<1.8&&x>10&&x<38)continue;if(inLotArea(x,z))continue;if(Math.hypot(x-shopPos.x,z-shopPos.z)<5)continue;
    q.setFromEuler(new THREE.Euler((r()-.5)*.5,r()*6.28,(r()-.5)*.5));const s=.6+r()*.9;sc.set(s,s*(.7+r()*.8),s);ps.set(x,hgt(x,z)-.02,z);M.compose(ps,q,sc);GRASS.setMatrixAt(k,M);
    col.setHSL(.24+r()*.08,.5+r()*.2,.32+r()*.14);GRASS.setColorAt(k,col);k++;}
  GRASS.count=k;GRASS.instanceMatrix.needsUpdate=true;if(GRASS.instanceColor)GRASS.instanceColor.needsUpdate=true;GRASS.receiveShadow=true;scene.add(GRASS);}
// くさ・木が かぜで ゆれる
let WINDU={value:0};
function addWind(){
  scene.traverse(o=>{if(o.isInstancedMesh&&o.count>=1000&&o.geometry.type==='ConeGeometry'&&!o.userData.wind){o.userData.wind=1;const m=o.material.clone();m.onBeforeCompile=sh=>{sh.uniforms.uW=WINDU;sh.vertexShader='uniform float uW;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n float hh=clamp(position.y+.22,0.,1.);vec4 wp=instanceMatrix*vec4(0.,0.,0.,1.);transformed.x+=sin(uW*2.1+wp.x*.35+wp.z*.2)*.09*hh;transformed.z+=cos(uW*1.7+wp.z*.3)*.06*hh;');};o.material=m;}});
}
// ポストエフェクト(ひかりの にじみ・いろ・ビネット)
const GRADE={uniforms:{tDiffuse:{value:null},uV:{value:.42},uSat:{value:1.12},uWarm:{value:.02}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float uV,uSat,uWarm;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));c.rgb=mix(vec3(l),c.rgb,uSat);c.rgb+=vec3(uWarm,uWarm*.4,-uWarm);c.rgb=c.rgb*1.04-.012;vec2 d=vUv-.5;c.rgb*=1.-dot(d,d)*uV;gl_FragColor=c;}'};
function buildComposer(){
  if(!THREE.EffectComposer||!THREE.UnrealBloomPass){COMP=null;return;}
  const w=window.innerWidth,h=window.innerHeight,pr=renderer.getPixelRatio();let rt;
  if(renderer.capabilities.isWebGL2&&THREE.WebGLMultisampleRenderTarget){rt=new THREE.WebGLMultisampleRenderTarget(w*pr,h*pr,{format:THREE.RGBAFormat});rt.samples=4;}
  COMP=new THREE.EffectComposer(renderer,rt);RPASS=new THREE.RenderPass(scene,camera);COMP.addPass(RPASS);
  BLOOM=new THREE.UnrealBloomPass(new THREE.Vector2(w,h),.3,.5,.92);COMP.addPass(BLOOM);

function draw(sc,cam){if(Q==='high'&&COMP){RPASS.scene=sc;RPASS.camera=cam;BLOOM.strength=sc===scene?(scene.userData.night?.7:.22):.3;BLOOM.threshold=scene.userData.night?.8:.93;COMP.render();}else renderer.render(sc,cam);}

{const _dn=dayNight;dayNight=function(){_dn();if(!SKY)return;
  const d=NOW(),h=d.getHours()+d.getMinutes()/60;const day=Math.max(0,Math.min(1,Math.sin((h-6)/12*Math.PI)*1.4));
  const eve=(h>16.5&&h<19)||(h>5&&h<7)?Math.max(0,1-Math.abs(((h>12?17.75:6)-h))/1.25):0;
  const U=SKY.material.uniforms;U.top.value.set(0x0a1230).lerp(new THREE.Color(SEASON==='winter'?0x6fb4f0:0x3d9bf5),day).lerp(new THREE.Color(0x6a6fd0),eve*.6);
  U.hor.value.set(0x1d2b55).lerp(new THREE.Color(SEASON==='winter'?0xe4f1ff:0xcdeeff),day).lerp(new THREE.Color(0xffa76b),eve*.8);
  const sa=(h-6)/12*Math.PI;U.sunD.value.set(Math.cos(sa)*.8,Math.max(-.2,Math.sin(sa))*.75+.05,-.55).normalize();U.sunA.value=Math.min(1,day*1.5);U.sunC.value.set(eve>0?0xffb070:0xfff3c4);

};}
function stepGfx(dt,t){GT.t=t;if(WATERU)WATERU.value=t;WINDU.value=t;
  if(SKY){SKY.position.copy(camera.position);STARS.position.copy(camera.position);STARS.material.uniforms.t.value=t;
    const sd=SKY.material.uniforms.sunD.value;MOONSPR.position.set(camera.position.x-sd.x*380,camera.position.y+Math.max(60,sd.y*-380+120),camera.position.z-sd.z*380);
    CLOUDS.rotation.y=t*.004;CLOUDS.position.set(camera.position.x*.9,0,camera.position.z*.9);}
  if(SPARK){SPARK.material.uniforms.t.value=t;SPARK.position.set(Math.round(P.x/40)*40,0,Math.round(P.z/40)*40);}

  for(let i=0;i<TREES.length;i++){const tr=TREES[i];if(tr.dead||tr.shake>0)continue;tr.crown.rotation.z=Math.sin(t*1.1+i*1.7)*.022;tr.crown.rotation.x=Math.cos(t*.9+i)*.015;}

}
