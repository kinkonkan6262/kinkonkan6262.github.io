<style>

 <div id="st-menu"><h2>🀄 麻雀</h2><p class="sub">東風戦（東1局〜東4局）</p>
  <p><input id="nm" maxlength="8" placeholder="なまえ" style="font:700 18px sans-serif;padding:8px;border-radius:10px;border:2px solid #cdb36b;text-align:center;width:180px"></p>

<script>
// ===== 牌・エンジン =====
const G={dealer:0,round:0,pot:0,live:[],dead:[],doraInd:[],uraInd:[],cur:0};
let P=[];
const NAMES_J=['東','南','西','北','白','發','中'];
const SUITN=['萬','筒','索'];
function tname(i){return i<27?((i%9+1)+SUITN[Math.floor(i/9)]):NAMES_J[i-27];}
function cnt(h){const c=new Array(34).fill(0);for(const t of h)c[t.id]++;return c;}
function seatWind(idx){return 27+((idx-G.dealer+4)%4);}
function nextDora(i){if(i<27)return Math.floor(i/9)*9+((i%9+1)%9);if(i<31)return 27+((i-27+1)%4);return 31+((i-31+1)%3);}
const isTH=i=>i>=27||i%9===0||i%9===8;

// ---- 向聴数 ----
function shantenStd(c,open){
  let best=8;
  function dfs(i,m,t,p){
    while(i<34&&c[i]===0)i++;
    if(i>=34){const tt=Math.min(t,4-m);const v=8-2*m-tt-p;if(v<best)best=v;return;}
    if(m>=4&&p)  {/* 面子4+雀頭あり: これ以上不要 */}
    if(c[i]>=3){c[i]-=3;dfs(i,m+1,t,p);c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;dfs(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;}
    if(!p&&c[i]>=2){c[i]-=2;dfs(i,m,t,1);c[i]+=2;}
    if(c[i]>=2){c[i]-=2;dfs(i,m,t+1,p);c[i]+=2;}
    if(i<27&&i%9<=7&&c[i+1]>0){c[i]--;c[i+1]--;dfs(i,m,t+1,p);c[i]++;c[i+1]++;}
    if(i<27&&i%9<=6&&c[i+2]>0){c[i]--;c[i+2]--;dfs(i,m,t+1,p);c[i]++;c[i+2]++;}
    c[i]--;dfs(i,m,t,p);c[i]++;
  }
  dfs(0,open,0,0);
  return best;
}
function shantenChii(c){let pairs=0,kinds=0;for(let i=0;i<34;i++){if(c[i]>=2)pairs++;if(c[i]>0)kinds++;}let s=6-pairs;if(kinds<7)s+=7-kinds;return s;}
function shanten(c,open){let s=shantenStd(c,open);if(open===0)s=Math.min(s,shantenChii(c));return s;}

// ---- 和了形 ----
function decomps(c,open){
  const out=[],need=4-open;
  for(let pr=0;pr<34;pr++){
    if(c[pr]<2)continue;
    c[pr]-=2;
    const sets=[];
    (function rec(i){
      while(i<34&&c[i]===0)i++;
      if(i>=34){if(sets.length===need)out.push({sets:sets.map(s=>s.slice()),pair:pr});return;}
      if(sets.length>=need)return;
      if(c[i]>=3){c[i]-=3;sets.push(['t',i]);rec(i);sets.pop();c[i]+=3;}
      if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;sets.push(['s',i]);rec(i);sets.pop();c[i]++;c[i+1]++;c[i+2]++;}
    })(0);
    c[pr]+=2;
  }
  return out;
}
function isChii(c){let n=0;for(let i=0;i<34;i++){if(c[i]===2)n++;else if(c[i]!==0)return false;}return n===7;}
function shapeWin(c,open){return(open===0&&isChii(c))||decomps(c,open).length>0;}
function waitList(c,open){const r=[];for(let t=0;t<34;t++){if(c[t]>=4)continue;c[t]++;if(shapeWin(c,open))r.push(t);c[t]--;}return r;}

// ---- 点数 ----
function basicPts(han,fu){if(han>=13)return 8000;if(han>=11)return 6000;if(han>=8)return 4000;if(han>=6)return 3000;return Math.min(fu*Math.pow(2,han+2),2000);}
function rankName(han,fu,b){if(han>=13)return '数え役満';if(han>=11)return '三倍満';if(han>=8)return '倍満';if(han>=6)return '跳満';if(b>=2000)return '満貫';return '';}
const ru=x=>Math.ceil(x/100)*100;

function places(d,w){
  const out=[];
  d.sets.forEach((s,k)=>{
    if(s[0]==='t'){if(s[1]===w)out.push({k,wait:'sh'});}
    else{const i=s[1];
      if(w===i+1)out.push({k,wait:'ka'});
      else if(w===i)out.push({k,wait:(i%9===6)?'pe':'ry'});
      else if(w===i+2)out.push({k,wait:(i%9===0)?'pe':'ry'});}
  });
  if(d.pair===w)out.push({k:-1,wait:'ta'});
  return out;
}

// pl: {idx,melds,riichi,ippatsu}  c: 和了牌を含む門前部分のカウント
function evaluate(pl,c,w,tsumo){
  const open=pl.melds.length,menzen=open===0;
  const all=[];for(let i=0;i<34;i++)for(let k=0;k<c[i];k++)all.push(i);
  pl.melds.forEach(m=>m.tiles.forEach(t=>all.push(t.id)));
  const sw=seatWind(pl.idx),rw=27;
  const doras=G.doraInd.map(t=>nextDora(t.id)),uras=G.uraInd.map(t=>nextDora(t.id));
  const cntIn=(list)=>{let n=0;for(const t of all)for(const d of list)if(t===d)n++;return n;};
  const kui=(h,m)=>menzen?h:(h-m);
  const common=()=>{
    const y=[];
    if(pl.riichi)y.push(['立直',1]);
    if(pl.riichi&&pl.ippatsu)y.push(['一発',1]);
    if(tsumo&&menzen)y.push(['門前清自摸和',1]);
    if(all.every(t=>t<27&&t%9>0&&t%9<8))y.push(['断么九',1]);
    const suits=new Set(all.filter(t=>t<27).map(t=>Math.floor(t/9)));
    const hon=all.some(t=>t>=27);
    if(suits.size===1)y.push(hon?['混一色',kui(3,1)]:['清一色',kui(6,1)]);
    if(all.every(isTH))y.push(['混老頭',2]);
    return y;
  };
  const finish=(y,fu)=>{
    const base=y.reduce((a,b)=>a+b[1],0);if(base<=0)return null;
    const d=cntIn(doras),u=pl.riichi?cntIn(uras):0;
    const han=base+d+u;const pts=basicPts(han,fu);
    const ys=y.slice();if(d)ys.push(['ドラ',d]);if(u)ys.push(['裏ドラ',u]);
    return{yaku:ys,han,fu,pts};
  };
  let best=null;
  const consider=r=>{if(r&&(!best||r.pts>best.pts||(r.pts===best.pts&&r.han>best.han)))best=r;};
  if(menzen&&isChii(c)){const y=common();y.push(['七対子',2]);consider(finish(y,25));}
  for(const d of decomps(c.slice(),open)){
    for(const pc of places(d,w)){
      const ms=[];
      d.sets.forEach((s,k)=>ms.push({t:s[0],i:s[1],open:(s[0]==='t'&&!tsumo&&pc.k===k&&pc.wait==='sh')}));
      pl.melds.forEach(m=>ms.push({t:m.type==='chi'?'s':'t',i:m.i,open:true}));
      const y=common();
      const pairYaku=d.pair>=31||d.pair===sw||d.pair===rw;
      let pinfu=false;
      if(menzen&&ms.every(m=>m.t==='s')&&!pairYaku&&pc.wait==='ry'){pinfu=true;y.push(['平和',1]);}
      if(menzen){const cc={};ms.filter(m=>m.t==='s').forEach(m=>cc[m.i]=(cc[m.i]||0)+1);let pp=0;for(const k in cc)pp+=Math.floor(cc[k]/2);if(pp>=2)y.push(['二盃口',3]);else if(pp===1)y.push(['一盃口',1]);}
      const tri=ms.filter(m=>m.t==='t'),seq=ms.filter(m=>m.t==='s');
      tri.forEach(m=>{
        if(m.i>=31)y.push([NAMES_J[m.i-27],1]);
        if(m.i===sw)y.push(['自風 '+NAMES_J[m.i-27],1]);
        if(m.i===rw)y.push(['場風 東',1]);
      });
      for(let n=0;n<7;n++)if(seq.some(m=>m.i===n)&&seq.some(m=>m.i===9+n)&&seq.some(m=>m.i===18+n)){y.push(['三色同順',kui(2,1)]);break;}
      for(let s=0;s<3;s++)if(seq.some(m=>m.i===s*9)&&seq.some(m=>m.i===s*9+3)&&seq.some(m=>m.i===s*9+6)){y.push(['一気通貫',kui(2,1)]);break;}
      if(tri.length===4)y.push(['対々和',2]);
      if(tri.filter(m=>!m.open).length>=3)y.push(['三暗刻',2]);
      for(let n=0;n<9;n++)if(tri.some(m=>m.i===n)&&tri.some(m=>m.i===9+n)&&tri.some(m=>m.i===18+n)){y.push(['三色同刻',2]);break;}
      const dr=tri.filter(m=>m.i>=31).length;if(dr===2&&d.pair>=31)y.push(['小三元',2]);
      const chOK=ms.every(m=>m.t==='t'?isTH(m.i):(m.i%9===0||m.i%9===6))&&isTH(d.pair);
      if(chOK&&seq.length>0){const hh=tri.some(m=>m.i>=27)||d.pair>=27;y.push(hh?['混全帯么九',kui(2,1)]:['純全帯么九',kui(3,2)]);}
      let fu;
      if(pinfu)fu=tsumo?20:30;
      else{
        fu=20;if(menzen&&!tsumo)fu+=10;if(tsumo)fu+=2;
        tri.forEach(m=>{fu+=(isTH(m.i)?4:2)*(m.open?1:2);});
        if(d.pair>=31)fu+=2;if(d.pair===sw)fu+=2;if(d.pair===rw)fu+=2;
        if(pc.wait==='ka'||pc.wait==='pe'||pc.wait==='ta')fu+=2;
        if(!menzen&&fu===20)fu=30;
        fu=Math.ceil(fu/10)*10;
      }
      consider(finish(y,fu));
    }
  }
  return best;

function visible(){
  const v=new Array(34).fill(0);
  P.forEach(p=>{p.pond.forEach(e=>{if(!e.called)v[e.tile.id]++;});p.melds.forEach(m=>m.tiles.forEach(t=>v[t.id]++));});
  G.doraInd.forEach(t=>v[t.id]++);return v;
}
function chooseDiscard(q){
  const pl=P[q],open=pl.melds.length,c=cnt(pl.hand),vis=visible();
  for(let i=0;i<34;i++)vis[i]+=c[i];
  const dor=G.doraInd.map(t=>nextDora(t.id)),sw=seatWind(q);
  const rp=P.filter((x,k)=>k!==q&&x.riichi);
  const ids=[];for(let i=0;i<34;i++)if(c[i]>0)ids.push(i);
  const sh={};let minS=99;
  for(const i of ids){c[i]--;sh[i]=shanten(c,open);c[i]++;if(sh[i]<minS)minS=sh[i];}
  let best=null,bs=-1e9;
  for(const i of ids){
    if(sh[i]>minS+((rp.length&&minS>=1)?1:0))continue;
    let score=-sh[i]*1000;
    if(sh[i]===minS){
      c[i]--;let u=0;
      for(let t=0;t<34;t++){const rem=4-vis[t];if(rem<=0)continue;c[t]++;if(shanten(c,open)<sh[i])u+=rem;c[t]--;}
      c[i]++;score+=u*8;
    }
    if(dor.includes(i))score-=30;
    if(i>=27){const yk=(i>=31||i===sw||i===27);score+=c[i]===1?(yk?2:5):(yk?-10:0);}
    else{const n=i%9;if(n===0||n===8)score+=2;else if(n===1||n===7)score+=1;}
    let pen=0;
    for(const r of rp){
      if(r.discAll.includes(i))continue;
      const base=i>=27?(vis[i]>=3?4:14):((i%9===0||i%9===8)?20:30);
      pen=Math.max(pen,base);
    }
    score-=pen*(sh[i]===0?0.3:1)*(minS>=1?1:0.4);
    score+=Math.random()*.5;
    if(score>bs){bs=score;best=i;}
  }
  return{tile:pl.hand.find(t=>t===pl.drawn&&t.id===best)||pl.hand.find(t=>t.id===best),shanten:minS};
}
function isFuriten(q){
  const pl=P[q];if(pl.furitenTemp||pl.furitenRiichi)return true;
  const w=waitList(cnt(pl.hand),pl.melds.length);
  return w.some(t=>pl.discAll.includes(t));
}
function canRon(q,tile){
  const pl=P[q],c=cnt(pl.hand);c[tile.id]++;
  if(!shapeWin(c,pl.melds.length))return false;
  if(isFuriten(q))return false;
  return !!evaluate(pl,c,tile.id,false);
}
function riichiCands(pl){
  const s=new Set(),seen={};
  for(const t of pl.hand){
    if(seen[t.id]!==undefined){if(seen[t.id])s.add(t.u);continue;}
    const c=cnt(pl.hand);c[t.id]--;
    const ok=waitList(c,pl.melds.length).length>0;seen[t.id]=ok;if(ok)s.add(t.u);
  }
  return s;
}
async function humanTurn(drawn,seat=MY){
  const me=P[seat];
  while(true){
    const c=cnt(me.hand);
    const canTsumo=!!(drawn&&evaluate(me,c,drawn.id,true));
    const btns=[];
    if(me.riichi){
      if(canTsumo){setMsg('ツモ和了できます！');btns.push({label:'ツモ！',cls:'win',v:{t:'tsumo'}},{label:'ツモ切り',v:{t:'discard',tile:drawn}});return await ask(btns,false);}
      setMsg('リーチ中…');render();await sleep(750);return{t:'discard',tile:drawn};
    }
    if(canTsumo)btns.push({label:'ツモ！',cls:'win',v:{t:'tsumo'}});
    const allowed=riichiCands(me);
    if(me.melds.length===0&&me.score>=1000&&G.live.length>=4&&allowed.size)btns.push({label:'リーチ',cls:'rch',v:{t:'riichiMode'}});
    btns.push({label:'おすすめ',v:{t:'hint'}});
    setMsg(drawn?'あなたの番です。捨てる牌をえらんでください':'捨てる牌をえらんでください');
    const a=await ask(btns,'discard');
    if(a.t==='hint'){ui.hint=chooseDiscard(0).tile.u;continue;}
    if(a.t==='riichiMode'){
      ui.riichiAllowed=allowed;setMsg('リーチ！ 光っている牌から捨ててください');
      const b=await ask([{label:'やめる',v:{t:'cancel'}}],'discard');
      ui.riichiAllowed=null;
      if(b.t==='cancel')continue;
      return{...b,riichi:true};
    }

  }
}

async function decideTurn(q,drawn){

  if(v.t==='tsumo')return{t:'tsumo'};
  const tile=P[q].hand.find(x=>x.u===v.u)||P[q].hand[P[q].hand.length-1];

function claimOptions(q,tile,from){
  const c=cnt(P[q].hand),id=tile.id,o={pon:c[id]>=2,chi:[]};
  if((from+1)%4===q&&id<27){
    const n=id%9,b=id-n;
    if(n>=2&&c[id-2]&&c[id-1])o.chi.push([id-2,id-1]);
    if(n>=1&&n<=7&&c[id-1]&&c[id+1])o.chi.push([id-1,id+1]);
    if(n<=6&&c[id+1]&&c[id+2])o.chi.push([id+1,id+2]);

function doCall(q,from,tile,kind,ids){
  const pl=P[q],used=[];
  for(const id of ids){const k=pl.hand.findIndex(t=>t.id===id);used.push(pl.hand.splice(k,1)[0]);}
  pl.melds.push({type:kind,i:kind==='pon'?tile.id:Math.min(tile.id,...ids),tiles:[...used,tile],from});
  const pe=P[from].pond[P[from].pond.length-1];pe.called=true;

function setupHand(){

  for(let i=wall.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[wall[i],wall[j]]=[wall[j],wall[i]];}
  G.dead=wall.splice(0,14);G.doraInd=[G.dead[4]];G.uraInd=[G.dead[9]];G.live=wall;
  P.forEach(p=>{p.hand=[];p.drawn=null;p.melds=[];p.pond=[];p.discAll=[];p.riichi=false;p.ippatsu=false;p.furitenTemp=false;p.furitenRiichi=false;});
  for(let k=0;k<13;k++)for(let i=0;i<4;i++)P[i].hand.push(G.live.pop());

async function playHand(){
  setupHand();G.cur=G.dealer;ui.msg='';render();
  await modal(`<h2>東${G.round+1}局</h2><p>親（東）：<b>${P[G.dealer].name}</b></p><p class="sub">ドラ表示牌 ${T(G.doraInd[0].id,'mini')}</p>`,'はじめる');
  let cur=G.dealer,draw=true;
  while(true){
    G.cur=cur;const pl=P[cur];let drawn=null;
    if(draw){
      if(G.live.length===0)return await ryuukyoku();
      drawn=G.live.pop();pl.hand.push(drawn);pl.drawn=drawn;
      if(cur===MY)click(420,.05);
    }else pl.drawn=null;
    render();
    const act=await decideTurn(cur,drawn);
    if(act.t==='tsumo')return await winHand(cur,cur,null,true);
    const tile=act.tile;
    pl.hand.splice(pl.hand.indexOf(tile),1);pl.drawn=null;sortHand(pl);
    if(!act.riichi&&pl.riichi)pl.ippatsu=false;
    pl.pond.push({tile,riichi:!!act.riichi,called:false});pl.discAll.push(tile.id);pl.furitenTemp=false;
    if(act.riichi){await announce('リーチ！',cur);}
    click(300,.07);render();
    // ロン判定
    for(let k=1;k<=3;k++){
      const q=(cur+k)%4;
      if(!canRon(q,tile))continue;
      if(isHuman(q)){
        const ch=await decideClaim(q,{ron:true,chi:[]},tile);
        if(ch.t==='ron')return await winHand(q,cur,tile,false);
        if(P[q].riichi)P[q].furitenRiichi=true;else P[q].furitenTemp=true;
      }else return await winHand(q,cur,tile,false);
    }
    if(act.riichi){pl.riichi=true;pl.ippatsu=true;pl.score-=1000;G.pot+=1000;render();}
    // 鳴き判定
    let claim=null;const live=G.live.length>0;
    if(live)for(let k=1;k<=3&&!claim;k++){
      const q=(cur+k)%4;if(!isHuman(q)||P[q].riichi)continue;
      const o=claimOptions(q,tile,cur);
      if(o.pon||o.chi.length){const ch=await decideClaim(q,o,tile);if(ch.t==='pon'||ch.t==='chi')claim={q,...ch};}
    }
    if(!claim&&live){
      for(let k=1;k<=3;k++){
        const q=(cur+k)%4;if(isHuman(q)||q===cur)continue;
        const p2=P[q];if(p2.riichi)continue;
        const c=cnt(p2.hand);
        if(c[tile.id]>=2&&(tile.id>=31||tile.id===seatWind(q)||tile.id===27)){claim={q,t:'pon'};break;}
      }
    }
    if(claim){
      await announce(claim.t==='pon'?'ポン！':'チー！',claim.q);
      doCall(claim.q,cur,tile,claim.t,claim.t==='pon'?[tile.id,tile.id]:claim.ids);
      cur=claim.q;draw=false;continue;
    }
    cur=(cur+1)%4;draw=true;
  }
}
async function winHand(w,from,tile,tsumo){
  const pl=P[w];const c=cnt(pl.hand);let wid;
  if(tsumo)wid=pl.drawn.id;else{c[tile.id]++;wid=tile.id;}
  const r=evaluate(pl,c,wid,tsumo);
  await announce(tsumo?'ツモ！':'ロン！',w);
  const dealer=w===G.dealer,delta=[0,0,0,0],b=r.pts;
  if(tsumo){for(let q=0;q<4;q++){if(q===w)continue;const a=ru(dealer||q===G.dealer?b*2:b);delta[q]-=a;delta[w]+=a;}}
  else{const a=ru(b*(dealer?6:4));delta[from]-=a;delta[w]+=a;}
  const pot=G.pot;delta[w]+=pot;G.pot=0;
  P.forEach((p,i)=>p.score+=delta[i]);
  const total=delta[w]-pot;
  const rest=pl.hand.filter(t=>t!==pl.drawn).slice();
  const hands=tsumo?rest.filter(t=>t!==pl.drawn):pl.hand.slice();
  const wt=tsumo?pl.drawn:tile;
  const rn=rankName(r.han,r.fu,b);
  const ura=pl.riichi?`<p class="sub">裏ドラ表示牌 ${T(G.uraInd[0].id,'mini')}</p>`:'';
  render();
  await modal(`<h2>${tsumo?'ツモ和了':'ロン和了'}　${pl.name}</h2>
   <div class="wh">${hands.map(t=>T(t.id)).join('')}<span class="gap"></span>${T(wt.id,'wint')}${pl.melds.map(meldHTML).join('')}</div>
   <p class="sub">ドラ表示牌 ${T(G.doraInd[0].id,'mini')}</p>${ura}
   <table class="yk">${r.yaku.map(y=>`<tr><td>${y[0]}</td><td>${y[1]}翻</td></tr>`).join('')}</table>
   <div class="big">${r.han}翻 ${r.fu}符 ${rn?`<span class="rk">${rn}</span>`:''} <b>${total.toLocaleString()}点</b></div>
   <div class="dl">${P.map((p,i)=>`<span>${p.name} ${p.score.toLocaleString()} <em class="${delta[i]>=0?'up':'dn'}">${delta[i]>=0?'+':''}${delta[i]}</em></span>`).join('')}</div>`);
  return{keep:dealer};
}
async function ryuukyoku(){
  const ten=P.map(p=>waitList(cnt(p.hand),p.melds.length).length>0);
  const n=ten.filter(Boolean).length,delta=[0,0,0,0];
  if(n>0&&n<4)P.forEach((p,i)=>{delta[i]=ten[i]?3000/n:-3000/(4-n);});
  P.forEach((p,i)=>p.score+=delta[i]);
  await announce('流局',0);
  await modal(`<h2>流局</h2>${P.map((p,i)=>`<div class="rr"><b>${p.name}</b> ${ten[i]?'<span class="up">テンパイ</span>':'<span class="dn">ノーテン</span>'}<div class="wh sm">${p.hand.map(t=>T(t.id)).join('')}${p.melds.map(meldHTML).join('')}</div></div>`).join('')}
   <div class="dl">${P.map((p,i)=>`<span>${p.name} ${p.score.toLocaleString()} <em class="${delta[i]>=0?'up':'dn'}">${delta[i]>=0?'+':''}${delta[i]}</em></span>`).join('')}</div>`);
  return{keep:ten[G.dealer]};
}
async function main(names){
  names=names||[myName(),'タロウ','サクラ','ミケ'];
  P=names.map((n,i)=>newPlayer(i,n,25000));
  G.round=0;G.dealer=0;G.pot=0;
  while(G.round<4){
    const r=await playHand();
    if(P.some(p=>p.score<0))break;
    if(!r.keep){G.dealer=(G.dealer+1)%4;G.round++;}
  }
  const rank=P.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  await modal(`<h2>対局終了</h2><ol class="rank">${rank.map(x=>`<li class="${!NET.on&&x.i===0?'me':''}"><b>${x.p.name}</b> ${x.p.score.toLocaleString()}点</li>`).join('')}</ol><p class="sub">${NET.on?`優勝：${rank[0].p.name}さん 🎉`:(rank[0].i===0?'優勝！おめでとうございます 🎉':'おつかれさまでした')}</p>`,'もう一度あそぶ');
  if(NET.on)hostStart();else main();
}
$('#snd').onclick=()=>{ui.sound=!ui.sound;$('#snd').textContent=ui.sound?'🔊 音あり':'🔈 音なし';};
$('#rst').onclick=()=>{try{net.leave();}catch(e){}location.reload();};
// ===== はじめの画面・インターネット対戦 =====
const ME={id:Math.random().toString(36).slice(2,10)};
function myName(){return (($('#nm')&&$('#nm').value.trim())||'あなた').slice(0,8);}
let LOBBY=[];
const net={ch:null,code:'',
  available(){return !!(window.KK_CONFIG&&window.KK_CONFIG.url&&window.supabase)||/[?&]local=1/.test(location.search);},
  open(code,host){
    this.leave();this.code=code;NET.host=host;const on=(ev,p)=>this.recv(ev,p);
    if(/[?&]local=1/.test(location.search)){const bc=new BroadcastChannel('mj-'+code);bc.onmessage=e=>on(e.data.ev,e.data.p);this.ch={send:(ev,p)=>bc.postMessage({ev,p}),close:()=>bc.close()};if(!host)this.hello();return;}
    const cfg=window.KK_CONFIG;if(!this.sb)this.sb=window.supabase.createClient(cfg.url,cfg.anonKey,{realtime:{params:{eventsPerSecond:30}}});
    const c=this.sb.channel('kk-mahjong-'+code,{config:{broadcast:{self:false},presence:{key:ME.id}}});
    ['hello','lobby','start','st','ask','ans','ann','modal','mclose','bye'].forEach(ev=>c.on('broadcast',{event:ev},m=>on(ev,m.payload)));
    c.on('presence',{event:'leave'},({key})=>on('bye',{id:key}));
    c.subscribe(st=>{if(st==='SUBSCRIBED'){c.track({n:1});if(!host)this.hello();}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')$('#lobst').textContent='つながりませんでした。もう一度 ためしてね';});
    this.ch={send:(ev,p)=>c.send({type:'broadcast',event:ev,payload:p}),close:()=>this.sb.removeChannel(c)};
  },
  hello(){clearInterval(this.ht);const f=()=>{if(LOBBY.some(p=>p.id===ME.id))return;this.send('hello',{id:ME.id,name:myName()});};f();this.ht=setInterval(f,1500);},
  send(ev,p){try{this.ch&&this.ch.send(ev,p);}catch(e){}},
  leave(){clearInterval(this.ht);if(this.ch){try{this.send('bye',{id:ME.id});this.ch.close();}catch(e){}}this.ch=null;},
  recv(ev,p){
    if(NET.host){
      if(ev==='hello'&&!NET.on){if(!LOBBY.some(x=>x.id===p.id)&&LOBBY.length<4)LOBBY.push({id:p.id,name:p.name});this.send('lobby',{list:LOBBY});lobbyShow();}
      else if(ev==='hello'&&NET.on){sendState();}
      else if(ev==='ans'){const pd=PEND[p.rid];if(pd)pd.done(p.v);}
      else if(ev==='bye'){const q=NET.ids.indexOf(p.id);
        if(NET.on&&q>=0&&NET.seats[q]==='remote'){NET.seats[q]='cpu';P[q].name+='(CPU)';Object.values(PEND).filter(x=>x.seat===q).forEach(async x=>x.done(await x.fallback()));render();}
        else if(!NET.on){LOBBY=LOBBY.filter(x=>x.id!==p.id||x.id===ME.id);this.send('lobby',{list:LOBBY});lobbyShow();}}
    }else{
      if(ev==='lobby'){LOBBY=p.list;lobbyShow();}
      else if(ev==='start'){NET.on=true;MY=p.ids.indexOf(ME.id);if(MY<0)MY=0;clearInterval(this.ht);$('#start').className='modal';}
      else if(ev==='st')applyState(p);
      else if(ev==='ann')announce(p.text,p.who);
      else if(ev==='modal')modalLocal(p.html,p.label,true);
      else if(ev==='mclose')$('#modal').className='modal';
      else if(ev==='ask'&&p.seat===MY)answer(p);
      else if(ev==='bye'&&LOBBY[0]&&p.id===LOBBY[0].id){setMsg('へやを つくった人が いなくなりました');render();}
    }
  }
};
let stT=null;
function queueState(){if(stT)return;stT=setTimeout(()=>{stT=null;sendState();},80);}
function sendState(){
  if(!NET.on||!NET.host)return;
  net.send('st',{G:{dealer:G.dealer,round:G.round,pot:G.pot,cur:G.cur,doraInd:G.doraInd,uraInd:G.uraInd,liveN:G.live.length},
    P:P.map(p=>({...p,drawn:p.drawn?p.drawn.u:null}))});
}
function applyState(p){
  Object.assign(G,p.G);G.live=new Array(p.G.liveN);
  P=p.P.map(x=>({...x,drawn:x.drawn==null?null:x.hand.find(t=>t.u===x.drawn)||null}));
  if(!ui.res)setMsg(G.cur===MY?'':`${P[G.cur].name}さんの番`);
  render();
}
async function answer(p){
  if(p.kind==='turn'){
    const drawn=p.args.du==null?null:P[MY].hand.find(t=>t.u===p.args.du);
    const a=await humanTurn(drawn,MY);
    net.send('ans',{rid:p.rid,v:{t:a.t,u:a.tile?a.tile.u:null,riichi:!!a.riichi}});
  }else{
    const ch=await humanClaim(p.args.opts,{id:p.args.tid,u:p.args.tu});
    net.send('ans',{rid:p.rid,v:ch});
  }
  setMsg('');render();
}
function hostStart(){
  const list=LOBBY.slice(0,4);const names=[],ids=[],seats=[];
  for(let i=0;i<4;i++){const x=list[i];if(x){names.push(x.name);ids.push(x.id);seats.push(x.id===ME.id?'me':'remote');}else{names.push(['タロウ','サクラ','ミケ'][i-1]||'CPU');ids.push('cpu'+i);seats.push('cpu');}}
  NET.on=true;NET.seats=seats;NET.ids=ids;MY=0;
  net.send('start',{ids,names});$('#start').className='modal';
  main(names);
}
function lobbyShow(){
  $('#st-menu').style.display='none';$('#st-lobby').style.display='block';$('#lobcode').textContent=net.code;
  $('#loblist').innerHTML=LOBBY.map((p,i)=>`<li>${i===0?'👑 ':''}${p.name}${p.id===ME.id?'（あなた）':''}</li>`).join('')+Array(Math.max(0,4-LOBBY.length)).fill('<li style="opacity:.5">あき（コンピュータ）</li>').join('');
  $('#lobgo').style.display=NET.host?'':'none';$('#lobwait').style.display=NET.host?'none':'block';
}
$('#b-cpu').onclick=()=>{NET.on=false;NET.seats=['me','cpu','cpu','cpu'];MY=0;$('#start').className='modal';main();};
$('#b-mk').onclick=()=>{if(!net.available()){$('#netst').textContent='インターネット対戦は、きんこんかんのアプリの ゲームコーナーから ひらいたときに つかえます';return;}
  const code=String(Math.floor(1000+Math.random()*9000));net.open(code,true);LOBBY=[{id:ME.id,name:myName()}];lobbyShow();};
$('#b-jn').onclick=()=>{if(!net.available()){$('#netst').textContent='インターネット対戦は、きんこんかんのアプリの ゲームコーナーから ひらいたときに つかえます';return;}
  const code=$('#jcode').value.replace(/\D/g,'');if(code.length!==4){$('#netst').textContent='4けたの ばんごうを いれてね';return;}
  net.open(code,false);LOBBY=[];lobbyShow();$('#loblist').innerHTML='<li>へやに はいっています…</li>';};
$('#lobgo').onclick=hostStart;
$('#lobcancel').onclick=()=>{net.leave();$('#st-lobby').style.display='none';$('#st-menu').style.display='block';};
try{$('#nm').value=localStorage.getItem('kk_name')||'';}catch(e){}
$('#nm').addEventListener('change',()=>{try{localStorage.setItem('kk_name',$('#nm').value);}catch(e){}});
window.addEventListener('beforeunload',()=>net.leave());
window.MJ={get P(){return P},get G(){return G},get MY(){return MY},get NET(){return NET},get ui(){return ui}};
</script></body></html>
