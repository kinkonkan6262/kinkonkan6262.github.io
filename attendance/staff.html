<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<title>出欠 職員用</title>
<style>

/* 構成: 上に「利用者/職員」の切替。利用者は大きなボタンの1列、職員は集計と一覧。出欠の区分と色は Anna AI支援記録 に合わせる */
:root{
  --bg:#f3f7f3; --surface:#ffffff; --fg:#14281a; --muted:#566a5a; --line:#d4e0d5;
  --accent:#1B5E20; --accent-fg:#ffffff; --accent-soft:#E8F5E9;
  --in:#2E7D32; --in-bg:#E8F5E9;
  --site:#1565C0; --site-bg:#E3F2FD;
  --home:#7B1FA2; --home-bg:#F3E5F5;
  --out:#4d5a51; --out-bg:#E9EDE9;
  --kasan:#B8420A; --kasan-bg:#FFF3E0;
  --ab:#855400; --ab-bg:#FFF8E1;
  --none:#7b8d7f;
  --font-body:'BIZ UDPGothic','Meiryo','Hiragino Kaku Gothic ProN',sans-serif;
  --font-disp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a12; --surface:#162319; --fg:#e5f0e6; --muted:#9db5a1; --line:#2a4230;
  --accent:#66BB6A; --accent-fg:#06200b; --accent-soft:#1a3320;
  --in:#81C784; --in-bg:#183321; --site:#64B5F6; --site-bg:#14283f; --home:#CE93D8; --home-bg:#2a1f40;
  --out:#b3beb6; --out-bg:#25302a; --kasan:#FFB74D; --kasan-bg:#3a2a0a; --ab:#f0b457; --ab-bg:#3a2a0a; --none:#809484; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1a12; --surface:#162319; --fg:#e5f0e6; --muted:#9db5a1; --line:#2a4230;
  --accent:#66BB6A; --accent-fg:#06200b; --accent-soft:#1a3320;
  --in:#81C784; --in-bg:#183321; --site:#64B5F6; --site-bg:#14283f; --home:#CE93D8; --home-bg:#2a1f40;
  --out:#b3beb6; --out-bg:#25302a; --kasan:#FFB74D; --kasan-bg:#3a2a0a; --ab:#f0b457; --ab-bg:#3a2a0a; --none:#809484; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-disp);margin:0;text-wrap:balance;line-height:1.3}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-disp);font-weight:700;font-size:24px}
.brand h1{font-size:20px}
.brand p{margin:0;font-size:13px}
.seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg a{padding:8px 16px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap}
.seg a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.on{background:var(--in)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px}
.btn{min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.s{min-height:36px;padding:4px 12px;font-size:14px}
.btn.link{border:none;background:none;color:var(--accent);text-decoration:underline;min-height:36px;padding:4px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* 利用者の画面 */
.u-who{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.u-name{font-family:var(--font-disp);font-size:30px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:52px;padding:6px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.u-date{font-family:var(--font-disp);font-size:28px;font-weight:700}
.big{width:100%;min-height:92px;border-radius:22px;border:3px solid;font-family:var(--font-disp);font-size:30px;font-weight:700}
.big.in{background:var(--in-bg);color:var(--in);border-color:var(--in)}
.big.home{background:var(--home-bg);color:var(--home);border-color:var(--home)}
.big.out{background:var(--out-bg);color:var(--out);border-color:var(--out)}
.big.plain{background:var(--surface);border-color:var(--line);font-size:22px;min-height:64px}
.big.r-hospital,.big.r-city,.big.r-sick,.big.r-other{background:var(--surface);color:var(--fg);border-color:var(--out)}
.stack{display:flex;flex-direction:column;gap:14px}
.done{text-align:center;padding:12px 0;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .mark{width:84px;height:84px;border-radius:50%;background:var(--in-bg);color:var(--in);display:grid;place-items:center;font-size:48px;font-weight:700}
.done p{margin:0;font-size:22px;font-weight:700}
.status-now{padding:12px 16px;border-radius:14px;background:var(--accent-soft);font-weight:700;font-size:18px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nm{min-height:68px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.nm b{font-size:20px;font-family:var(--font-disp)}
.nm span{font-size:12px;color:var(--muted)}
.upl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.upl li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--bg)}
.note-in{width:100%;min-height:56px;font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}

/* 職員の画面 */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.datebar .dl{font-family:var(--font-disp);font-size:22px;font-weight:700;margin-right:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:var(--surface)}
.tile .n{font-family:var(--font-disp);font-size:34px;font-weight:700;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted)}
.tile.in{background:var(--in-bg);border-color:transparent}.tile.in .n{color:var(--in)}
.tile.out{background:var(--out-bg);border-color:transparent}.tile.out .n{color:var(--out)}
.tile.none{border-style:dashed}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.b-in{background:var(--in-bg);color:var(--in)}
.b-site{background:var(--site-bg);color:var(--site)}
.b-home{background:var(--home-bg);color:var(--home)}
.b-out{background:var(--out-bg);color:var(--out)}
.b-kasan{background:var(--kasan-bg);color:var(--kasan)}
.b-none{border:1px dashed var(--none);color:var(--muted)}
.b-hospital,.b-city,.b-sick,.b-other{border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.over{color:var(--kasan);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.sec-h{display:flex;align-items:center;gap:8px;font-family:var(--font-disp);font-size:17px;font-weight:700;margin:6px 0 0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.li{border:2px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.li-main{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;background:none;border:none;text-align:left;min-height:48px}
.li-main .who{font-weight:700;min-width:0}
.li-main .who small{color:var(--muted);font-weight:400;margin-left:6px}
.li-panel{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 12px;border-top:1px dashed var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form select,.form input{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:6px 10px;font-size:16px;min-width:0}
.tblw{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{background:var(--accent-soft);font-size:12px}
tfoot td{font-weight:700;background:var(--accent-soft)}
.banner{padding:10px 14px;border-radius:12px;background:var(--ab-bg);color:var(--ab);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:20}
@media (max-width:480px){.big{font-size:26px}.u-name{font-size:26px}.u-date{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nm,.big{transition:transform .08s}.big:active,.nm:active,.chip:active{transform:scale(.98)}}

html{color-scheme:light dark}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qr-card{border:2px solid var(--line);border-radius:14px;background:#fff;color:#111;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;break-inside:avoid}
.qr-card svg{width:100%;max-width:170px;height:auto;display:block}
.qr-card b{font-family:var(--font-disp);font-size:18px}
.qr-card small{color:#444;font-size:11px}
.lv-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.lv-h{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.lv-day{min-height:58px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv-day small{font-size:9px;max-width:100%;overflow:hidden;word-break:break-all;line-height:1.15;margin-top:2px}
.lv-day.off,.lv-t td.off{background:#ffb74d;border-color:#e65100;color:#3e2000;font-weight:800}
.lv-day.blank{border:none;background:none}
.lv-t{border-collapse:collapse;font-size:12px}.lv-t th,.lv-t td{border:1px solid var(--line);padding:3px 4px;text-align:center;min-width:22px}
.lv-t th:first-child,.lv-t td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;min-width:80px;max-width:110px;overflow:hidden;white-space:nowrap}
.lv-t th.sun{color:#c62828}.lv-t th.sat{color:#1565c0}
.lv-key{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.login{max-width:420px;margin:24px auto 0;width:100%}
.login input{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:6px 12px;font-size:16px;width:100%}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.errtxt{color:var(--kasan);font-weight:700}
@media print{
  body{background:#fff;color:#000;padding:0}
  .noprint,.top,.tabs,.banner,.toast{display:none!important}
  .card{border:none;padding:0}
  .qr-grid{grid-template-columns:repeat(3,1fr);gap:8mm}
  .qr-card{border:1px solid #000}
}
</style>
</head>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);

<script>
(function(){

var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

var enrolled=function(m,d){return (!m.joined||m.joined<=d)&&(!m.left||d<m.left)};

/* ---------- ログインと通信 ---------- */
function authPost(path,body){
  return fetch(CFG.url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':CFG.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,j:j}})});
}
function setSession(j,email){
  A.tok=j.access_token;A.rtok=j.refresh_token;A.exp=Date.now()+(j.expires_in||3600)*1000;
  A.email=(j.user&&j.user.email)||email||A.email;
  try{sessionStorage.setItem('shk_sess',JSON.stringify({tok:A.tok,rtok:A.rtok,exp:A.exp,email:A.email}))}catch(e){}
}
function refresh(){
  if(!A.rtok)return Promise.reject(new Error('auth'));
  return authPost('token?grant_type=refresh_token',{refresh_token:A.rtok}).then(function(r){
    if(!r.ok||!r.j.access_token)throw new Error('auth');setSession(r.j);
  });
}
function logout(){
  A={tok:null,rtok:null,exp:0,email:'',admin:false,id:'',name:''};SA={list:[],err:'',email:'',name:'',pw:'',busy:false,confirm:null};S.members={};S.att={};S.loaded={};
  try{sessionStorage.removeItem('shk_sess')}catch(e){}
  V.view='login';V.login={email:'',pw:'',err:'',busy:false};render();
}
function rest(path,opts,retried){
  opts=opts||{};
  var go=function(){
    var h=Object.assign({'apikey':CFG.anonKey,'Authorization':'Bearer '+A.tok,'Content-Type':'application/json'},opts.headers||{});
    return fetch(CFG.url+'/rest/v1/'+path,Object.assign({},opts,{headers:h})).then(function(r){
      if(r.status===401&&!retried)return refresh().then(function(){return rest(path,opts,true)});
      if(r.status===401){logout();throw new Error('auth');}
      if(!r.ok)return r.text().then(function(t){throw new Error(t||('http '+r.status))});
      return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null});
    });
  };
  if(A.exp-Date.now()<60000&&A.rtok&&!retried)return refresh().then(go);
  return go();
}
function fetchAll(path){
  var out=[];
  function page(o){return rest(path+'&limit=1000&offset='+o).then(function(rows){out=out.concat(rows||[]);return (rows&&rows.length===1000)?page(o+1000):out;});}
  return page(0);
}

function doLogin(){
  var l=V.login;if(l.busy)return;
  if(!l.email.trim()||!l.pw){l.err='メールとパスワードを入れてください';render();return;}
  l.busy=true;l.err='';render();
  authPost('token?grant_type=password',{email:l.email.trim(),password:l.pw}).then(function(r){
    if(!r.ok||!r.j.access_token){l.busy=false;l.err='ログインできません。メールとパスワードを確かめてください';render();return;}
    setSession(r.j,l.email.trim());
    return enter();
  }).catch(function(){l.busy=false;l.err='つながりません。電波を確かめてください';render();});
}
function enter(){
  return rest('shk_settings?select=open_days&id=eq.1').then(function(rows){
    if(!rows||!rows.length){
      V.login.busy=false;V.login.err='このログインは職員として登録されていません。管理者に聞いてください';
      A={tok:null,rtok:null,exp:0,email:'',admin:false,id:'',name:''};try{sessionStorage.removeItem('shk_sess')}catch(e){}
      V.view='login';render();return;
    }
    S.cfg={open:rows[0].open_days||[1,2,3,4,5]};
    return rest('rpc/shk_me',{method:'POST',body:'{}'}).then(function(me){A.admin=!!(me&&me.admin);A.id=(me&&me.id)||'';A.name=(me&&me.name)||'';},function(){A.admin=false;}).then(function(){
      V.view='app';V.login={email:'',pw:'',err:'',busy:false};
      return loadMembers().then(function(){render();need();startPoll();});
    });
  });
}
function loadMembers(){
  return fetchAll('shk_members?select=id,name,kana,type,joined,left_date,token,pin,pin_user&order=id.asc').then(function(rows){
    var o={};rows.forEach(function(r){o[r.id]={name:r.name,kana:r.kana||'',type:r.type||'B',joined:r.joined||'',left:r.left_date||'',token:r.token,pin:r.pin||'',pinUser:!!r.pin_user}});S.members=o;
  });
}
function loadMonth(ym){
  var y=+ym.slice(0,4),mo=+ym.slice(5,7),first=ym+'-01',last=ymd(new Date(y,mo,0));
  S.loading[ym]=true;
  return fetchAll('shk_attendance?select=member_id,day,status,reason,note&day=gte.'+first+'&day=lte.'+last+'&order=day.asc,member_id.asc').then(function(rows){
    Object.keys(S.att).forEach(function(d){if(d.slice(0,7)===ym)delete S.att[d]});
    rows.forEach(function(r){var a=S.att[r.day]||(S.att[r.day]={records:{}});a.records[r.member_id]={s:r.status,r:r.reason||'',n:r.note||''}});
    S.loaded[ym]=true;S.loading[ym]=false;
  }).catch(function(e){S.loading[ym]=false;throw e;});
}
function wantMonths(){var o={};o[V.sdate.slice(0,7)]=1;o[V.mon]=1;return Object.keys(o);}
function need(){
  wantMonths().forEach(function(ym){
    if(!S.loaded[ym]&&!S.loading[ym])loadMonth(ym).then(render).catch(function(){toast('よみこめませんでした。電波を確かめてください')});
  });
}
var pollT=null,lastSig='';
function sig(){return JSON.stringify([S.members,wantMonths().map(function(m){return Object.keys(S.att).filter(function(d){return d.slice(0,7)===m}).sort().map(function(d){return [d,S.att[d].records]})}),S.cfg])}
function startPoll(){
  clearInterval(pollT);lastSig=sig();
  pollT=setInterval(function(){
    if(V.view!=='app'||document.hidden||S.pending>0||V.busy)return;
    var before=sig();
    Promise.all([loadMembers()].concat(wantMonths().map(loadMonth))).then(function(){
      if(S.pending>0)return;var after=sig();if(after!==before)render();
    }).catch(function(){});
  },15000);
}

/* ---------- 保存 ---------- */
function failSave(e){
  S.pending=Math.max(0,S.pending-1);
  toast('保存できませんでした。電波を確かめて、もう一度ためしてください');
  Promise.all(wantMonths().map(loadMonth)).then(render).catch(render);
}
function saveRec(d,id,r){
  r=r||{s:''};var one={s:r.s||'',r:r.r||'',n:r.n||''};
  var a=S.att[d]||(S.att[d]={records:{}});
  if(one.s)a.records[id]=one;else delete a.records[id];
  render();S.pending++;
  var p=one.s
    ?rest('shk_attendance?on_conflict=member_id,day',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({member_id:id,day:d,status:one.s,reason:one.r,note:one.n,by_user:false,updated_at:new Date().toISOString()})})
    :rest('shk_attendance?member_id=eq.'+encodeURIComponent(id)+'&day=eq.'+d,{method:'DELETE',headers:{'Prefer':'return=minimal'}});
  p.then(function(){S.pending=Math.max(0,S.pending-1)}).catch(failSave);
}
function dbMember(m){return {name:m.name,kana:m.kana,type:m.type||'B',joined:m.joined||null,left_date:m.left||null};}
function patchMember(id,m){
  S.members[id]=m;render();S.pending++;
  rest('shk_members?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(Object.assign(dbMember(m),{token:m.token}))})
    .then(function(){S.pending=Math.max(0,S.pending-1)}).catch(function(e){S.pending=Math.max(0,S.pending-1);toast('保存できませんでした');loadMembers().then(render)});
}
function addMember(m){
  V.busy=true;render();
  return rest('shk_members',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(dbMember(m))}).then(function(rows){
    var r=rows&&rows[0];V.busy=false;
    if(r){S.members[r.id]={name:r.name,kana:r.kana||'',type:r.type||'B',joined:r.joined||'',left:r.left_date||'',token:r.token,pin:r.pin||'',pinUser:false};}
    V.f={name:'',kana:'',joined:TODAY,type:'B'};render();toast('登録しました');
  }).catch(function(){V.busy=false;render();toast('登録できませんでした')});
}
function saveCfg(){
  render();S.pending++;
  rest('shk_settings?id=eq.1',{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({open_days:S.cfg.open})})
    .then(function(){S.pending=Math.max(0,S.pending-1)}).catch(failSave);
}
function newToken(){var a=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(a);return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('');}

/* ---------- 画面 ---------- */
function topbar(){
  return '<div class="top"><div class="brand"><div class="logo" aria-hidden="true">出</div><div><h1>'+esc(CFG.facility||'')+' 出欠(職員用)</h1><p class="muted">'+esc(A.name||'職員')+'</p></div></div>'+(V.view==='app'?'<button class="btn s" data-act="logout">ログアウト</button>':'')+'</div>';
}
function loginView(){
  var l=V.login;
  return '<section class="card login"><h2>職員のログイン</h2><form id="login-form" autocomplete="on"><div class="stack">'+
   '<label>メール<input id="l-email" type="email" autocomplete="username" value="'+esc(l.email)+'"></label>'+
   '<label>パスワード<input id="l-pw" type="password" autocomplete="current-password" value="'+esc(l.pw)+'"></label>'+
   (l.err?'<div class="errtxt">'+esc(l.err)+'</div>':'')+
   '<button class="btn p" type="submit"'+(l.busy?' disabled':'')+'>'+(l.busy?'ログイン中…':'ログイン')+'</button></div></form>'+

function staffView(){
  var tabs=[['today','今日の出欠'],['roster','利用者の名簿'],['month','月の集計'],['qr','QRカード'],['pin','共通QR・暗証番号'],['leave','職員の休み']];
  var h='<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-act="tab" data-t="'+t[0]+'" aria-selected="'+(V.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';

function badge(r){
  if(!r)return '<span class="badge b-none">未連絡</span>';
  var h='<span class="badge b-'+r.s+'">'+ST[r.s]+'</span>';
  if(isAbs(r)){var k=REASONS[r.r]?r.r:'other';h+=' <span class="badge b-'+k+'">'+REASONS[k]+'</span>';}
  return h;
}
function todayView(){
  var d=V.sdate,ym=d.slice(0,7);
  if(!S.loaded[ym])return '<section class="card"><p class="muted">よみこみ中…</p></section>';
  var ms=list().filter(function(m){return enrolled(m,d)});
  var cnt={att:0,in:0,site:0,home:0,out:0,kasan:0,none:0},rc={hospital:0,city:0,sick:0,other:0};
  ms.forEach(function(m){var r=rec(d,m.id);if(!r)cnt.none++;else if(isAtt(r)){cnt.att++;cnt[r.s]++;}else{cnt.out++;if(r.s==='kasan')cnt.kasan++;rc[REASONS[r.r]?r.r:'other']++;}});
  var h='<section class="card"><div class="datebar"><div class="dl">'+fmt(d)+'</div>'+
   '<button class="btn s" data-act="sd" data-n="-1" aria-label="前の日">◀</button><button class="btn s" data-act="sd" data-n="0">今日</button><button class="btn s" data-act="sd" data-n="1" aria-label="次の日">▶</button>'+
   '<input type="date" id="s-date" value="'+esc(d)+'" style="min-height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:2px 8px"></div>';
  if(!isOpen(d))h+='<div class="banner">この日は開所日ではありません(月の集計の「開所する曜日」で変えられます)</div>';
  h+='<div class="tiles"><div class="tile"><div class="n tn">'+ms.length+'</div><div class="l">在籍している人</div></div>'+
   '<div class="tile in"><div class="n tn">'+cnt.att+'</div><div class="l">出席(通所・施設外・在宅)</div></div>'+
   '<div class="tile out"><div class="n tn">'+cnt.out+'</div><div class="l">欠席</div></div>'+
   '<div class="tile none"><div class="n tn">'+cnt.none+'</div><div class="l">まだ連絡なし</div></div></div>';
  if(cnt.att)h+='<div class="row-flex"><span class="muted">出席の内わけ:</span>'+['in','site','home'].filter(function(k){return cnt[k]}).map(function(k){return '<span class="badge b-'+k+'">'+ST[k]+' '+cnt[k]+'</span>'}).join('')+'</div>';
  if(cnt.out)h+='<div class="row-flex"><span class="muted">欠席の理由:</span>'+RKEYS.filter(function(k){return rc[k]}).map(function(k){return '<span class="badge b-'+k+'">'+REASONS[k]+' '+rc[k]+'</span>'}).join('')+'</div>';
  var groups=[['未連絡',ms.filter(function(m){return !rec(d,m.id)})],['欠席',ms.filter(function(m){return isAbs(rec(d,m.id))})],['出席',ms.filter(function(m){return isAtt(rec(d,m.id))})]];
  if(!ms.length)h+='<p class="muted">この日に在籍している利用者がいません。</p>';
  groups.forEach(function(g){
    if(!g[1].length)return;

  $('#app').innerHTML=topbar()+body;
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  if(V.view==='app'&&!V.boot)need();
}

/* ---------- 操作 ---------- */
var ACT={
  logout:function(){logout();},
  tab:function(t){V.tab=t.t;V.openRow=null;if(t.t==='staff')SA.confirm=null;render();if(t.t==='staff')loadStaff();if(t.t==='leave')loadLeave();},
  lvm:function(t){var n=+t.n;if(n===0)LV.mon=TODAY.slice(0,7);else{var y=+LV.mon.slice(0,4),m=+LV.mon.slice(5,7)+n,d=new Date(y,m-1,1);LV.mon=d.getFullYear()+'-'+pad(d.getMonth()+1);}loadLeave();render();},
  lvday:function(t){var on=!((LV.rows[lvTarget()]||{})[t.d]);lvSet([t.d],on);},
  lvon:function(){lvSet(lvRange(),true);},
  lvoff:function(){lvSet(lvRange(),false);},
  stcf:function(t){SA.confirm=t.id;render();},
  stcx:function(){SA.confirm=null;render();},
  strm:function(t){staffCall('shk_staff_remove',{p_id:t.id},'職員から外しました',function(r){if(r&&r.email)fnCall({action:'delete',email:r.email}).catch(function(){});});},
  stname:function(t){var el=document.getElementById('sn-'+t.id);staffCall('shk_staff_set_name',{p_id:t.id,p_name:el?el.value:''},'名前を保存しました',function(){if(t.id===A.id){A.name=(el&&el.value.trim())||'';}});},
  stadm:function(t){staffCall('shk_staff_set_admin',{p_id:t.id,p_admin:t.a==='1'},t.a==='1'?'管理者にしました':'管理者をやめました');},
  stadd:function(){
    var em=SA.email.trim(),pw=SA.pw;
    if(!em){toast('メールを入れてください');return;}
    if(!pw){staffCall('shk_staff_add',{p_email:em,p_name:SA.name.trim()},'職員に登録しました');return;}
    if(pw.length<8){toast('パスワードは8文字以上にしてください');return;}
    if(SA.busy)return;SA.busy=true;
    fnCall({action:'create',email:em,password:pw,name:SA.name.trim()}).then(function(r){
      SA.busy=false;
      if(r&&r.ok){SA.email='';SA.pw='';SA.name='';toast('職員を登録しました。メールとパスワードを本人に伝えてください');return loadStaff();}
      var e=r&&r.error;
      if(e==='exists'){SA.email='';SA.pw='';toast('そのメールは、すでにログインがあります。職員として登録しました(パスワードは前のままです)');loadStaff();return;}
      toast(r.status===404?'職員登録の部品が、まだSupabaseに入っていません':e==='weak'?'パスワードが弱すぎます。もっと長くしてください':e==='email'?'メールの形が正しくありません':'登録できませんでした');render();
    }).catch(function(){SA.busy=false;toast('つながりません。電波を確かめてください');render();});
  },
  sd:function(t){var n=+t.n;V.sdate=n===0?TODAY:add(V.sdate,n);V.openRow=null;render();},
  row:function(t){V.openRow=V.openRow===t.id?null:t.id;render();},
  set:function(t){V.openRow=null;saveRec(V.sdate,t.id,t.s?{s:t.s,r:t.r||'',n:''}:{s:''});},
  kasan:function(t){var r=rec(V.sdate,t.id);if(!r)return;saveRec(V.sdate,t.id,{s:r.s==='kasan'?'out':'kasan',r:r.r,n:r.n});},
  addm:function(){
    var f=V.f;if(!f.name.trim()||!f.kana.trim()){toast('名前とふりがなを入れてください');return;}
    addMember({name:f.name.trim(),kana:f.kana.trim(),joined:f.joined||TODAY,left:'',type:f.type||'B'});
  },
  leave:function(t){V.leaving=t.id;V.reissue=null;V.leaveDate=TODAY;render();},
  reissue:function(t){V.reissue=t.id;V.leaving=null;render();},
  cancelx:function(){V.leaving=null;V.reissue=null;render();},
  leaveok:function(t){var m=Object.assign({},S.members[t.id],{left:V.leaveDate||TODAY});V.leaving=null;patchMember(t.id,m);toast('退所を記録しました');},
  reissueok:function(t){var m=Object.assign({},S.members[t.id],{token:newToken()});V.reissue=null;patchMember(t.id,m);
    rest('rpc/shk_pin_reset',{method:'POST',body:JSON.stringify({p_member:t.id})}).then(function(pin){if(pin&&S.members[t.id]){S.members[t.id].pin=pin;S.members[t.id].pinUser=false;render();}}).catch(function(){});
    toast('作り直しました。「QRカード」「共通QR・暗証番号」から印刷してください');},
  'return':function(t){var m=Object.assign({},S.members[t.id],{left:''});patchMember(t.id,m);},
  sm:function(t){var n=+t.n;if(n===0)V.mon=TODAY.slice(0,7);else{var y=+V.mon.slice(0,4),m=+V.mon.slice(5,7)+n;var d=new Date(y,m-1,1);V.mon=d.getFullYear()+'-'+pad(d.getMonth()+1);}render();},
  day:function(t){var w=+t.w,o=S.cfg.open.slice(),i=o.indexOf(w);if(i>=0)o.splice(i,1);else o.push(w);S.cfg={open:o};saveCfg();},
  print:function(){window.print();}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset);}});
document.addEventListener('submit',function(e){if(e.target.id==='login-form'){e.preventDefault();doLogin();}});
document.addEventListener('input',function(e){var id=e.target.id,v=e.target.value;
  if(id==='f-name')V.f.name=v;else if(id==='f-kana')V.f.kana=v;
  else if(id==='st-name')SA.name=v;else if(id==='st-email')SA.email=v;else if(id==='lv-who'){}else if(id==='st-pw')SA.pw=v;else if(id==='l-email')V.login.email=v;else if(id==='l-pw')V.login.pw=v;
  else if(id==='q-find'){V.qfind=v;render();}});
document.addEventListener('change',function(e){var id=e.target.id,v=e.target.value;
  if(id==='lv-who'){LV.who=v;render();}
  else if(id==='lv-from'){LV.from=v||TODAY;if(!LV.to||LV.to<LV.from)LV.to=LV.from;render();}
  else if(id==='lv-to'){LV.to=v||LV.from;render();}
  else if(id==='s-date'&&v){V.sdate=v;V.openRow=null;render();}
  else if(id==='f-joined'){V.f.joined=v||TODAY;}
  else if(id==='f-type'){V.f.type=v||'B';}
  else if(id==='f-leave'){V.leaveDate=v||TODAY;}});

/* ---------- 起動 ---------- */
(function boot(){
  var s=null;try{s=JSON.parse(sessionStorage.getItem('shk_sess')||'null')}catch(e){}
  if(s&&s.tok){
    A.tok=s.tok;A.rtok=s.rtok;A.exp=s.exp;A.email=s.email;
    V.boot=false;V.view='app';render();
    enter().catch(function(){V.view='login';render();});
  }else{V.boot=false;V.view='login';render();}
})();
})();
</script>
</body>
</html>
